<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="SPORTNEXIA Cricket Live - Live cricket scores, matches and results."
  >

  <meta name="robots" content="index, follow">

  <title>Cricket Live | SPORTNEXIA</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =========================
       BASIC RESET
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
    }


    /* =========================
       HEADER
    ========================= */

    .site-header {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }


    /* =========================
       LIVE NAVIGATION
    ========================= */

    .sport-live-nav {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e7eaf0;

      position: sticky;
      top: 0;
      z-index: 9999;
    }

    .sport-live-nav-inner {
      max-width: 1200px;
      margin: 0 auto;

      padding: 10px 16px;

      display: flex !important;
      align-items: center;

      gap: 8px;

      overflow-x: auto;
      scrollbar-width: none;
    }

    .sport-live-nav-inner::-webkit-scrollbar {
      display: none;
    }

    .sport-live-nav a {
      display: inline-flex !important;

      align-items: center;
      justify-content: center;

      flex: 0 0 auto;

      min-height: 38px;

      padding: 9px 14px;

      border-radius: 999px;

      border: 1px solid #e5e8ef;

      background: #f4f6fa;

      color: #172033;

      text-decoration: none;

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
    }

    .sport-live-nav .home-btn {
      background: #238cff !important;
      color: #ffffff !important;
      border-color: #238cff !important;
    }


    /* =========================
       BREAKING BAR
    ========================= */

    .breaking-bar {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }


    /* =========================
       CRICKET LIVE INTRO
    ========================= */

    .cricket-live-intro {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100%;

      background:
        linear-gradient(
          135deg,
          #061224 0%,
          #0a1d38 55%,
          #09284b 100%
        );

      color: #ffffff;

      text-align: center;

      padding: 32px 15px;
    }

    .cricket-live-intro h1 {
      display: block !important;

      margin: 0;

      color: #ffffff !important;

      font-size: 32px;
      line-height: 1.2;

      font-weight: 800;
    }

    .cricket-live-intro p {
      display: block !important;

      margin: 10px 0 0;

      color: #b9c8da !important;

      font-size: 14px;
    }


    /* =========================
       LIVE MATCH SECTION
    ========================= */

    .cricket-live-section {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100%;

      background: #f5f7fb;

      padding: 40px 20px 70px;

      min-height: 500px;
    }

    .cricket-live-inner {
      display: block !important;

      max-width: 1200px;

      margin: 0 auto;
    }

    .cricket-live-title {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      margin: 0 0 25px;

      color: #081426 !important;

      font-size: 38px;

      line-height: 1.2;

      font-weight: 800;
    }


    /* =========================
       CRICKET MATCHES
    ========================= */

    #cricketMatches {
      display: grid !important;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 20px;

      width: 100%;
    }


    /* =========================
       LOADING
    ========================= */

    #cricketMatches .loading {
      display: block !important;

      grid-column: 1 / -1;

      padding: 30px;

      text-align: center;

      color: #667085;

      background: #ffffff;

      border-radius: 14px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .sport-live-nav-inner {
        padding: 9px 10px;
      }

      .sport-live-nav a {
        font-size: 12px;
        padding: 8px 12px;
      }

      .cricket-live-intro {
        padding: 26px 12px;
      }

      .cricket-live-intro h1 {
        font-size: 28px;
      }

      .cricket-live-intro p {
        font-size: 13px;
      }

      .cricket-live-section {
        padding: 30px 15px 55px;
      }

      .cricket-live-title {
        font-size: 28px;
        margin-bottom: 20px;
      }

      #cricketMatches {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="index.html"
        class="brand"
      >
        SPORT<span>NEXIA</span>
      </a>

    </div>

  </header>


  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav class="sport-live-nav">

    <div class="sport-live-nav-inner">

      <a
        href="index.html"
        class="home-btn"
      >
        🏠 Home
      </a>

      <a href="javascript:history.back()">
        ← Back
      </a>

    </div>

  </nav>


  <!-- =========================
       BREAKING BAR
  ========================= -->

  <div class="breaking-bar">

    <div class="container">

      <span class="breaking-label">
        LIVE
      </span>

      <span id="breakingText">
        Live cricket matches and scores
      </span>

    </div>

  </div>


  <!-- =========================
       CRICKET LIVE INTRO
  ========================= -->

  <section
    class="cricket-live-intro"
    id="cricketLiveIntro"
  >

    <h1>
      🔴 Cricket Live
    </h1>

    <p>
      Live cricket matches, scores and results
    </p>

  </section>


  <!-- =========================
       CRICKET MATCHES
  ========================= -->

  <section
    class="cricket-live-section"
    id="cricketLiveSection"
  >

    <div class="cricket-live-inner">

      <h2 class="cricket-live-title">
        Live &amp; Upcoming Matches
      </h2>

      <div id="cricketMatches">

        <div class="loading">
          Loading cricket matches...
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       SCRIPTS
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="sport.js"></script>


</body>

</html>
