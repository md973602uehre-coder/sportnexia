<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SPORTNEXIA Football News - Latest football news and updates."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <title>Football News | SPORTNEXIA</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sport.css">

  <style>

    /* =========================
       PAGE NAVIGATION
    ========================= */

    .page-navigation {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100%;

      background: #ffffff !important;

      border-bottom: 1px solid #e5e9f0;

      position: sticky;
      top: 0;
      z-index: 9999;
    }


    .page-navigation-inner {

      max-width: 1200px;
      margin: 0 auto;

      padding: 10px 16px;

      display: flex !important;

      align-items: center;

      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .page-navigation-inner::-webkit-scrollbar {
      display: none;
    }


    .page-navigation a,
    .page-navigation button {

      display: inline-flex !important;

      align-items: center;
      justify-content: center;

      flex: 0 0 auto;

      min-height: 38px;

      padding: 9px 14px;

      border: 1px solid #e3e7ee !important;

      border-radius: 999px;

      background: #f5f7fa !important;

      color: #111827 !important;

      font-family: inherit;

      font-size: 13px;

      font-weight: 700;

      text-decoration: none;

      white-space: nowrap;

      cursor: pointer;
    }


    .page-navigation .home-button {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;
    }


    .page-navigation .language-button.active {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;
    }


    .page-navigation a:hover,
    .page-navigation button:hover {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;
    }


    /* =========================
       NEWS PAGE
    ========================= */

    .football-news-page {

      padding: 35px 0 60px;
    }


    .football-news-page .section-heading {

      margin-bottom: 25px;
    }


    .football-news-page .section-heading h1 {

      margin: 8px 0;

    }


    .football-news-page .section-heading p {

      margin: 0;

      color: #6b7280;

    }

  </style>

</head>


<body class="sport-page">


  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="index.html"
        class="brand"
      >
        SPORT<span>NEXIA</span>
      </a>

    </div>

  </header>


  <!-- =========================
       PAGE NAVIGATION
  ========================= -->

  <nav
    class="page-navigation"
    id="pageNavigation"
  >

    <div class="page-navigation-inner">


      <a
        href="index.html"
        class="home-button"
      >
        🏠 Home
      </a>


      <a
        href="javascript:history.back()"
      >
        ← Back
      </a>


      <button
        type="button"
        class="language-button active"
        id="banglaButton"
      >
        🇧🇩 বাংলা
      </button>


      <button
        type="button"
        class="language-button"
        id="englishButton"
      >
        🇬🇧 English
      </button>


    </div>

  </nav>


  <!-- =========================
       BREAKING
  ========================= -->

  <div class="breaking-bar">

    <div class="container">

      <span class="breaking-label">
        BREAKING
      </span>

      <span id="breakingText">
        সর্বশেষ ফুটবল আপডেট
      </span>

    </div>

  </div>


  <!-- =========================
       FOOTBALL NEWS
  ========================= -->

  <main>

    <section class="football-news-page">

      <div class="container">


        <div class="section-heading">

          <span class="hero-kicker">
            সর্বশেষ খবর
          </span>


          <h1>
            ফুটবল সংবাদ
          </h1>


          <p>
            বিশ্বের সর্বশেষ ফুটবল খবর ও আপডেট।
          </p>

        </div>


        <div
          id="footballNews"
          class="football-news-grid"
        >

          <div class="loading">
            খবর লোড হচ্ছে...
          </div>

        </div>


      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="site-footer">

    <div class="container">

      <strong>
        SPORTNEXIA
      </strong>


      <p>
        Football • Cricket • Sports Updates
      </p>


      <p>
        © 2026 SPORTNEXIA. All rights reserved.
      </p>

    </div>

  </footer>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="sport.js"></script>


</body>

</html>
