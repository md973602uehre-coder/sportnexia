<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SPORTNEXIA Football News - Latest football news and updates."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <title>Football News | SPORTNEXIA</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sport.css">


  <style>

    /* =========================
       PAGE NAVIGATION
    ========================= */

    .page-navigation {

      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100%;

      background: #ffffff !important;

      border-bottom: 1px solid #e5e9f0;

      position: sticky;

      top: 0;

      z-index: 9999;

    }


    .page-navigation-inner {

      max-width: 1200px;

      margin: 0 auto;

      padding: 10px 16px;

      display: flex !important;

      align-items: center;

      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

    }


    .page-navigation-inner::-webkit-scrollbar {

      display: none;

    }


    .page-navigation a,
    .page-navigation button {

      display: inline-flex !important;

      align-items: center;

      justify-content: center;

      flex: 0 0 auto;

      min-height: 38px;

      padding: 9px 14px;

      border: 1px solid #e3e7ee !important;

      border-radius: 999px;

      background: #f5f7fa !important;

      color: #111827 !important;

      font-family: inherit;

      font-size: 13px;

      font-weight: 700;

      text-decoration: none;

      white-space: nowrap;

      cursor: pointer;

    }


    .page-navigation .home-button {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;

    }


    .page-navigation .language-button.active {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;

    }


    .page-navigation a:hover,
    .page-navigation button:hover {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;

    }


    /* =========================
       NEWS PAGE
    ========================= */

    .football-news-page {

      padding: 35px 0 60px;

    }


    .football-news-page .section-heading {

      margin-bottom: 25px;

    }


    .football-news-page .section-heading h1 {

      margin: 8px 0;

    }


    .football-news-page .section-heading p {

      margin: 0;

      color: #6b7280;

    }


    /* =========================
       NEWS CARD LINK
    ========================= */

    .news-card-link {

      display: block;

      text-decoration: none;

      color: inherit;

      cursor: pointer;

    }


    .news-card-link:hover {

      text-decoration: none;

    }


    /* =========================
       BREAKING TICKER
    ========================= */

    .breaking-bar {

      display: flex !important;

      align-items: center !important;

      width: 100% !important;

      overflow: hidden !important;

      background: #f5f6fa !important;

      border-bottom: 1px solid #e2e5eb !important;

      height: 48px !important;

      box-sizing: border-box !important;

    }


    .breaking-label {

      flex: 0 0 auto !important;

      background: #e50914 !important;

      color: #ffffff !important;

      font-weight: 800 !important;

      font-size: 14px !important;

      padding: 14px 16px !important;

      height: 100% !important;

      display: flex !important;

      align-items: center !important;

      box-sizing: border-box !important;

      position: relative !important;

      z-index: 2 !important;

    }


    .breaking-window {

      flex: 1 !important;

      min-width: 0 !important;

      overflow: hidden !important;

      white-space: nowrap !important;

      position: relative !important;

    }


    .breaking-track {

      display: inline-flex !important;

      width: max-content !important;

      min-width: 100% !important;

      animation: footballBreakingMove 24s linear infinite !important;

    }


    .breaking-track span {

      display: inline-block !important;

      padding-left: 28px !important;

      padding-right: 80px !important;

      color: #111827 !important;

      font-size: 15px !important;

      font-weight: 600 !important;

    }


    @keyframes footballBreakingMove {

      0% {

        transform: translateX(100%);

      }

      100% {

        transform: translateX(-100%);

      }

    }


    @media (max-width: 600px) {

      .breaking-bar {

        height: 44px !important;

      }


      .breaking-label {

        font-size: 12px !important;

        padding: 12px 12px !important;

      }


      .breaking-track span {

        font-size: 14px !important;

      }

    }

  </style>

</head>


<body class="sport-page">


  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="index.html"
        class="brand"
      >
        SPORT<span>NEXIA</span>
      </a>

    </div>

  </header>


  <!-- =========================
       PAGE NAVIGATION
  ========================= -->

  <nav
    class="page-navigation"
    id="pageNavigation"
  >

    <div class="page-navigation-inner">


      <a
        href="index.html"
        class="home-button"
        id="homeButton"
      >
        🏠 Home
      </a>


      <a
        href="javascript:history.back()"
        id="backButton"
      >
        ← Back
      </a>


      <button
        type="button"
        class="language-button active"
        id="banglaButton"
      >
        🇧🇩 বাংলা
      </button>


      <button
        type="button"
        class="language-button"
        id="englishButton"
      >
        🇬🇧 English
      </button>


    </div>

  </nav>


  <!-- =========================
       BREAKING
  ========================= -->

  <div
    class="breaking-bar"
    id="breakingBar"
  >

    <div class="breaking-label">
      BREAKING
    </div>


    <div class="breaking-window">

      <div
        class="breaking-track"
        id="breakingTrack"
      >

        <span id="breakingText">
          সর্বশেষ ফুটবল আপডেট
        </span>

        <span>
          সর্বশেষ ফুটবল আপডেট
        </span>

      </div>

    </div>

  </div>


  <!-- =========================
       FOOTBALL NEWS
  ========================= -->

  <main>

    <section class="football-news-page">

      <div class="container">


        <div class="section-heading">

          <span
            class="hero-kicker"
            id="footballNewsKicker"
          >
            সর্বশেষ খবর
          </span>


          <h1
            id="footballNewsTitle"
          >
            ফুটবল সংবাদ
          </h1>


          <p
            id="footballNewsDescription"
          >
            বিশ্বের সর্বশেষ ফুটবল খবর ও আপডেট।
          </p>

        </div>


        <div
          id="footballNews"
          class="football-news-grid"
        >

          <div class="loading">

            খবর লোড হচ্ছে...

          </div>

        </div>


      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="site-footer">

    <div class="container">

      <strong>
        SPORTNEXIA
      </strong>


      <p id="footerSportsText">
        Football • Cricket • Sports Updates
      </p>


      <p>
        © 2026 SPORTNEXIA. All rights reserved.
      </p>

    </div>

  </footer>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="sport.js"></script>


  <!-- =========================
       FOOTBALL PAGE LANGUAGE
  ========================= -->

  <script>

    function updateFootballPageLanguage() {

      const language =
        localStorage.getItem(
          "sportnexiaLanguage"
        ) || "bn";


      const isEnglish =
        language === "en";


      /* =========================
         HTML LANGUAGE
      ========================= */

      document.documentElement.lang =
        isEnglish
          ? "en"
          : "bn";


      /* =========================
         PAGE TITLE
      ========================= */

      document.title =
        isEnglish
          ? "Football News | SPORTNEXIA"
          : "ফুটবল সংবাদ | SPORTNEXIA";


      /* =========================
         KICKER
      ========================= */

      const kicker =
        document.getElementById(
          "footballNewsKicker"
        );


      if (kicker) {

        kicker.textContent =
          isEnglish
            ? "LATEST STORIES"
            : "সর্বশেষ খবর";

      }


      /* =========================
         MAIN TITLE
      ========================= */

      const title =
        document.getElementById(
          "footballNewsTitle"
        );


      if (title) {

        title.textContent =
          isEnglish
            ? "Football News"
            : "ফুটবল সংবাদ";

      }


      /* =========================
         DESCRIPTION
      ========================= */

      const description =
        document.getElementById(
          "footballNewsDescription"
        );


      if (description) {

        description.textContent =
          isEnglish
            ? "Follow the latest football news and updates from around the world."
            : "বিশ্বের সর্বশেষ ফুটবল খবর ও আপডেট।";

      }


      /* =========================
         FOOTER
      ========================= */

      const footerSports =
        document.getElementById(
          "footerSportsText"
        );


      if (footerSports) {

        footerSports.textContent =
          isEnglish
            ? "Football • Cricket • Sports Updates"
            : "ফুটবল • ক্রিকেট • খেলাধুলার আপডেট";

      }

    }


    /* =========================
       RUN NOW
    ========================= */

    updateFootballPageLanguage();


    /* =========================
       LANGUAGE BUTTON LISTENERS
    ========================= */

    const bnButton =
      document.getElementById(
        "banglaButton"
      );


    const enButton =
      document.getElementById(
        "englishButton"
      );


    if (bnButton) {

      bnButton.addEventListener(
        "click",
        () => {

          setTimeout(
            updateFootballPageLanguage,
            50
          );

        }
      );

    }


    if (enButton) {

      enButton.addEventListener(
        "click",
        () => {

          setTimeout(
            updateFootballPageLanguage,
            50
          );

        }
      );

    }

  </script>


</body>

</html>
