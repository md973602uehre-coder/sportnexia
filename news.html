<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPORTNEXIA - News</title>
  <meta name="description" content="SPORTNEXIA - Latest football, cricket and sports news.">
  <link rel="stylesheet" href="style.css">

  <style>
    .single-news-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
    }

    .news-language-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 15px 0;
    }

    .news-language-buttons a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 25px;
      text-decoration: none;
      background: #edf2f7;
      color: #172033;
      font-weight: 700;
    }

    .news-language-buttons a.active {
      background: #1687ee;
      color: white;
    }

    .single-news-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }

    .news-error {
      padding: 25px;
      text-align: center;
    }
  </style>
</head>

<body>

  <header class="nav">
    <a href="index.html" class="logo">
      SPORT<span>NEXIA</span>
    </a>

    <nav>
      <a href="index.html">🏠 Home</a>
    </nav>
  </header>

  <main>
    <section class="single-news" id="singleNews">
      <div class="news-loading">Loading news...</div>
    </section>
  </main>

  <footer>
    <b>SPORT<span>NEXIA</span></b>
    <p>© 2026 SPORTNEXIA. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[c]));

    const dateFmt = value => {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return '';

      return date.toLocaleDateString(
        currentLanguage === 'bn' ? 'bn-BD' : 'en-GB',
        {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        }
      );
    };

    const params = new URLSearchParams(window.location.search);
    const currentLanguage = params.get('lang') === 'bn' ? 'bn' : 'en';

    async function loadNews() {
      const id = params.get('id');
      const container = document.getElementById('singleNews');

      document.documentElement.lang = currentLanguage;

      if (!id) {
        showError('News not found');
        return;
      }

      const { data, error } = await db
        .from('news')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !data) {
        showError('News not found');
        return;
      }

      let title;
      let content;
      let image;

      if (currentLanguage === 'bn') {
        title = data.title_bn || data.title;
        content = data.content_bn || data.content;
        image = data.image_bn || data.image_url;
      } else {
        // English must use English fields only.
        title = data.title_en;
        content = data.content_en;
        image = data.image_en;

        if (!title || !content) {
          showError('English version is not available for this news yet.');
          return;
        }
      }

      const banglaUrl = `news.html?id=${encodeURIComponent(id)}&lang=bn`;
      const englishUrl = `news.html?id=${encodeURIComponent(id)}&lang=en`;

      document.title = `${title} | SPORTNEXIA`;

      container.innerHTML = `
        <div class="single-news-wrap">

          <a href="index.html" class="home-button">
            🏠 ${currentLanguage === 'bn' ? 'হোম' : 'Home'}
          </a>

          <div class="news-language-buttons">
            <a href="${banglaUrl}"
               class="${currentLanguage === 'bn' ? 'active' : ''}">
              🇧🇩 বাংলা
            </a>

            <a href="${englishUrl}"
               class="${currentLanguage === 'en' ? 'active' : ''}">
              🇬🇧 English
            </a>
          </div>

          ${image ? `
            <img
              class="single-news-image"
              src="${esc(image)}"
              alt="${esc(title)}"
            >
          ` : ''}

          <div class="single-news-content">
            <label>${esc(data.category || 'SPORTS')}</label>

            <h1>${esc(title)}</h1>

            <div class="single-news-meta">
              ${esc(dateFmt(data.created_at))} • SPORTNEXIA
            </div>

            <div class="single-news-text">${esc(content)}</div>

            <button class="share-button" onclick="shareNews()">
              🔗 ${currentLanguage === 'bn' ? 'খবর শেয়ার করুন' : 'Share News'}
            </button>
          </div>

        </div>
      `;
    }

    function showError(message) {
      document.getElementById('singleNews').innerHTML = `
        <div class="news-error">
          <h2>${esc(message)}</h2>
          <a href="index.html">🏠 Home</a>
        </div>
      `;
    }

    async function shareNews() {
      const title = document.querySelector('.single-news-content h1')?.textContent
        || 'SPORTNEXIA News';

      const shareData = {
        title,
        text: title,
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(window.location.href);
          alert('News link copied!');
        } else {
          prompt('Copy this news link:', window.location.href);
        }
      } catch (error) {
        console.log(error);
      }
    }

    loadNews();
  </script>

</body>
</html>
