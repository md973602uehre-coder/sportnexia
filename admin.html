<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SPORTNEXIA Admin Panel</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f3f5f7;
      color:#111827;
    }
    header{
      background:#07111f;
      color:white;
      padding:18px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header h1{margin:0;font-size:23px}
    header span{color:#38bdf8}
    button{
      border:0;
      border-radius:8px;
      padding:11px 16px;
      font-weight:bold;
      cursor:pointer;
    }
    .logout{background:#ef4444;color:white}
    .container{
      width:min(1000px,94%);
      margin:25px auto;
    }
    .box{
      background:white;
      padding:22px;
      border-radius:14px;
      margin-bottom:22px;
      box-shadow:0 5px 20px rgba(0,0,0,.06);
    }
    #loginPanel{
      width:min(500px,94%);
      margin:70px auto;
    }
    #adminPanel{display:none}
    label{
      display:block;
      margin:14px 0 7px;
      font-weight:bold;
    }
    input,textarea,select{
      width:100%;
      padding:12px;
      border:1px solid #d1d5db;
      border-radius:8px;
      font-size:15px;
    }
    textarea{
      min-height:130px;
      resize:vertical;
    }
    .loginBtn,.publishBtn{
      width:100%;
      margin-top:18px;
      background:#0284c7;
      color:white;
      font-size:16px;
    }
    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
    }
    .title{
      border-left:4px solid #0284c7;
      padding-left:10px;
    }
    .preview{
      display:none;
      width:100%;
      max-height:220px;
      object-fit:contain;
      margin-top:10px;
      border-radius:10px;
      background:#eee;
    }
    .status{
      display:none;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
    }
    .success{background:#dcfce7;color:#166534}
    .error{background:#fee2e2;color:#991b1b}
    .news{
      border:1px solid #ddd;
      background:#fafafa;
      padding:15px;
      border-radius:10px;
      margin-top:12px;
    }
    .delete{
      background:#dc2626;
      color:white;
      margin-top:10px;
    }
    .meta{
      color:#6b7280;
      font-size:13px;
      margin-top:8px;
    }
    @media(max-width:700px){
      .two{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<header>
  <h1>SPORT<span>NEXIA</span> Admin Panel</h1>

  <button
    id="logoutBtn"
    class="logout"
    style="display:none"
  >
    Logout
  </button>
</header>


<!-- LOGIN -->

<div id="loginPanel" class="box">

  <h2>🔐 Admin Login</h2>

  <p>
    SPORTNEXIA Admin Panel-এ প্রবেশ করুন।
  </p>

  <label>Email</label>

  <input
    id="email"
    type="email"
    value="mdnimeholder02@gmail.com"
    autocomplete="email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="loginBtn"
  >
    Login
  </button>

  <div id="loginStatus" class="status"></div>

</div>


<!-- ADMIN -->

<div id="adminPanel">

  <div class="container">

    <!-- PUBLISH -->

    <div class="box">

      <h2>📰 Publish News</h2>

      <label>Category</label>

      <select id="category">
        <option value="Football">Football</option>
        <option value="Cricket">Cricket</option>
        <option value="Sports">Sports</option>
      </select>


      <div class="two">

        <!-- BANGLA -->

        <div>

          <h3 class="title">🇧🇩 বাংলা</h3>

          <label>বাংলা Title</label>

          <input
            id="titleBn"
            type="text"
            placeholder="বাংলা শিরোনাম"
          >

          <label>বাংলা Content</label>

          <textarea
            id="contentBn"
            placeholder="বাংলা নিউজ লিখুন..."
          ></textarea>

          <label>বাংলা Image</label>

          <input
            id="imageBn"
            type="file"
            accept="image/*"
          >

          <img
            id="previewBn"
            class="preview"
          >

        </div>


        <!-- ENGLISH -->

        <div>

          <h3 class="title">🇬🇧 English</h3>

          <label>English Title</label>

          <input
            id="titleEn"
            type="text"
            placeholder="English headline"
          >

          <label>English Content</label>

          <textarea
            id="contentEn"
            placeholder="Write English news..."
          ></textarea>

          <label>English Image</label>

          <input
            id="imageEn"
            type="file"
            accept="image/*"
          >

          <img
            id="previewEn"
            class="preview"
          >

        </div>

      </div>


      <button
        id="publishBtn"
        class="publishBtn"
      >
        🚀 Publish News
      </button>

      <div id="publishStatus" class="status"></div>

    </div>


    <!-- OLD NEWS -->

    <div class="box">

      <h2>📚 Published News</h2>

      <div id="newsList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* IMPORTANT ADMIN EMAIL */

const ADMIN_EMAIL =
  "mdnimeholder02@gmail.com";


const loginPanel =
  document.getElementById("loginPanel");

const adminPanel =
  document.getElementById("adminPanel");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginStatus =
  document.getElementById("loginStatus");

const publishBtn =
  document.getElementById("publishBtn");

const publishStatus =
  document.getElementById("publishStatus");

const newsList =
  document.getElementById("newsList");


function statusBox(box,msg,type){

  box.textContent = msg;

  box.className =
    "status " + type;

  box.style.display = "block";
}


function showLogin(){

  loginPanel.style.display = "block";

  adminPanel.style.display = "none";

  logoutBtn.style.display = "none";

}


function showAdmin(){

  loginPanel.style.display = "none";

  adminPanel.style.display = "block";

  logoutBtn.style.display = "block";

}


/* LOGIN */

loginBtn.onclick = async function(){

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  loginStatus.style.display = "none";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  const {data,error} =
    await db.auth.signInWithPassword({
      email:email,
      password:password
    });


  loginBtn.disabled = false;
  loginBtn.textContent = "Login";


  if(error){

    statusBox(
      loginStatus,
      "Login failed: " + error.message,
      "error"
    );

    return;
  }


  if(
    !data.user ||
    data.user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await db.auth.signOut();

    statusBox(
      loginStatus,
      "এই Account Admin Account নয়।",
      "error"
    );

    return;
  }


  showAdmin();

  await loadNews();

};


/* LOGOUT */

logoutBtn.onclick = async function(){

  logoutBtn.disabled = true;
  logoutBtn.textContent = "Logging out...";


  const {error} =
    await db.auth.signOut();


  if(error){

    alert(
      "Logout হয়নি: " + error.message
    );

    logoutBtn.disabled = false;
    logoutBtn.textContent = "Logout";

    return;
  }


  /* Clear browser session */

  try{

    Object.keys(localStorage).forEach(key=>{

      if(
        key.includes("supabase") ||
        key.includes("auth-token")
      ){
        localStorage.removeItem(key);
      }

    });

  }catch(e){}


  showLogin();

  document.getElementById("password").value = "";

  logoutBtn.disabled = false;
  logoutBtn.textContent = "Logout";

};


/* IMAGE PREVIEW */

function preview(input, img){

  input.onchange = function(){

    const file = input.files[0];

    if(!file){
      img.style.display = "none";
      return;
    }

    img.src =
      URL.createObjectURL(file);

    img.style.display = "block";

  };

}


preview(
  document.getElementById("imageBn"),
  document.getElementById("previewBn")
);

preview(
  document.getElementById("imageEn"),
  document.getElementById("previewEn")
);


/* UPLOAD */

async function uploadImage(file,folder){

  if(!file) return null;


  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const path =
    folder + "/" +
    Date.now() + "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." + ext;


  const {error} =
    await db.storage
      .from("news-images")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error) throw error;


  const {data} =
    db.storage
      .from("news-images")
      .getPublicUrl(path);


  return data.publicUrl;

}


/* PUBLISH */

publishBtn.onclick = async function(){

  publishBtn.disabled = true;
  publishBtn.textContent = "Publishing...";

  publishStatus.style.display = "none";


  try{

    const category =
      document.getElementById("category").value;

    const titleBn =
      document.getElementById("titleBn").value.trim();

    const contentBn =
      document.getElementById("contentBn").value.trim();

    const titleEn =
      document.getElementById("titleEn").value.trim();

    const contentEn =
      document.getElementById("contentEn").value.trim();

    const fileBn =
      document.getElementById("imageBn").files[0];

    const fileEn =
      document.getElementById("imageEn").files[0];


    if(!titleBn || !contentBn){

      throw new Error(
        "বাংলা Title এবং Content দিন।"
      );

    }

    if(!titleEn || !contentEn){

      throw new Error(
        "English Title এবং Content দিন।"
      );

    }


    const imageBn =
      await uploadImage(
        fileBn,
        "bangla"
      );

    const imageEn =
      await uploadImage(
        fileEn,
        "english"
      );


    const {error} =
      await db
        .from("news")
        .insert({

          category:category,

          title:titleBn,

          content:contentBn,

          image_url:imageBn,

          title_bn:titleBn,

          content_bn:contentBn,

          image_bn:imageBn,

          title_en:titleEn,

          content_en:contentEn,

          image_en:imageEn

        });


    if(error) throw error;


    statusBox(
      publishStatus,
      "✅ News successfully published!",
      "success"
    );


    document.getElementById("titleBn").value = "";
    document.getElementById("contentBn").value = "";
    document.getElementById("titleEn").value = "";
    document.getElementById("contentEn").value = "";
    document.getElementById("imageBn").value = "";
    document.getElementById("imageEn").value = "";

    document.getElementById("previewBn").style.display = "none";
    document.getElementById("previewEn").style.display = "none";


    await loadNews();


  }catch(error){

    console.error(error);

    statusBox(
      publishStatus,
      "❌ " + error.message,
      "error"
    );

  }


  publishBtn.disabled = false;
  publishBtn.textContent = "🚀 Publish News";

};


/* LOAD OLD NEWS */

async function loadNews(){

  newsList.innerHTML =
    "Loading published news...";


  const {data,error} =
    await db
      .from("news")
      .select(
        "id,title,title_bn,title_en,category,created_at"
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    newsList.innerHTML =
      `<div class="status error" style="display:block">
        ❌ News load হয়নি: ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    newsList.innerHTML =
      "<p>কোনো Published News নেই।</p>";

    return;
  }


  newsList.innerHTML =
    data.map(news=>{

      const bn =
        news.title_bn ||
        news.title ||
        "No Bangla Title";

      const en =
        news.title_en ||
        "No English Title";

      const date =
        new Date(news.created_at)
          .toLocaleString("en-GB");


      return `
        <div
          class="news"
          id="news-${news.id}"
        >

          <h3>
            🇧🇩 ${escapeHtml(bn)}
          </h3>

          <div>
            🇬🇧 ${escapeHtml(en)}
          </div>

          <div class="meta">
            ${escapeHtml(news.category || "SPORTS")}
            •
            ${escapeHtml(date)}
          </div>

          <button
            class="delete"
            onclick="deleteNews(${news.id})"
          >
            🗑️ Delete
          </button>

        </div>
      `;

    }).join("");

}


/* DELETE */

async function deleteNews(id){

  if(
    !confirm(
      "এই News টি Delete করতে চান?"
    )
  ) return;


  const {error} =
    await db
      .from("news")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Delete হয়নি: " + error.message
    );

    return;
  }


  const item =
    document.getElementById(
      "news-" + id
    );

  if(item) item.remove();

}


/* ESCAPE */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>'"]/g,
      c=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"

      }[c])
    );

}


/* SESSION */

async function checkSession(){

  const {data} =
    await db.auth.getSession();

  const user =
    data?.session?.user;


  if(
    user &&
    user.email &&
    user.email.toLowerCase() ===
    ADMIN_EMAIL.toLowerCase()
  ){

    showAdmin();

    await loadNews();

  }else{

    showLogin();

  }

}


db.auth.onAuthStateChange(
  async (event,session)=>{

    if(event === "SIGNED_OUT"){

      showLogin();

      return;
    }

  }
);


checkSession();

</script>

</body>
</html>
