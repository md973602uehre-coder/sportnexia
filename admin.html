<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPORTNEXIA Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #07111f;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header span {
      color: #38bdf8;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .container {
      width: min(1000px, 94%);
      margin: 25px auto;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #0284c7;
    }

    .publish {
      margin-top: 20px;
      width: 100%;
      background: #0284c7;
      color: white;
      font-size: 16px;
    }

    .publish:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .image-preview {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      margin-top: 10px;
      border-radius: 10px;
      display: none;
      background: #f3f4f6;
    }

    .news-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-top: 14px;
      background: #fafafa;
    }

    .news-item h3 {
      margin: 0 0 8px;
    }

    .news-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #adminPanel {
      display: none;
    }

    #loginPanel {
      max-width: 450px;
      margin: 80px auto;
    }

    .login-btn {
      width: 100%;
      margin-top: 18px;
      background: #0284c7;
      color: white;
      font-size: 16px;
    }

    .hint {
      color: #6b7280;
      font-size: 13px;
      margin-top: 8px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    @media (max-width: 700px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      border-left: 4px solid #0284c7;
      padding-left: 10px;
      margin-top: 25px;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>SPORT<span>NEXIA</span> Admin Panel</h1>

  <button
    id="logoutBtn"
    class="logout"
    style="display:none;"
  >
    Logout
  </button>
</header>


<!-- ================= LOGIN ================= -->

<div id="loginPanel" class="box">

  <h2>🔐 Admin Login</h2>

  <p class="hint">
    SPORTNEXIA Admin Panel-এ প্রবেশ করতে Login করুন।
  </p>

  <label>Email</label>
  <input
    type="email"
    id="loginEmail"
    placeholder="Admin email"
    autocomplete="email"
  >

  <label>Password</label>
  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="login-btn"
  >
    Login
  </button>

  <div
    id="loginStatus"
    class="status"
  ></div>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div id="adminPanel">

  <div class="container">

    <!-- PUBLISH -->

    <div class="box">

      <h2>📰 Publish News</h2>

      <label>Category</label>

      <select id="category">
        <option value="Football">Football</option>
        <option value="Cricket">Cricket</option>
        <option value="Sports">Sports</option>
      </select>


      <div class="two-col">

        <!-- BANGLA -->

        <div>

          <h3 class="section-title">
            🇧🇩 বাংলা
          </h3>

          <label>বাংলা Title</label>

          <input
            type="text"
            id="titleBn"
            placeholder="বাংলা শিরোনাম"
          >

          <label>বাংলা Content</label>

          <textarea
            id="contentBn"
            placeholder="বাংলা নিউজ লিখুন..."
          ></textarea>

          <label>বাংলা Image</label>

          <input
            type="file"
            id="imageBn"
            accept="image/*"
          >

          <img
            id="previewBn"
            class="image-preview"
            alt="Bangla preview"
          >

        </div>


        <!-- ENGLISH -->

        <div>

          <h3 class="section-title">
            🇬🇧 English
          </h3>

          <label>English Title</label>

          <input
            type="text"
            id="titleEn"
            placeholder="English headline"
          >

          <label>English Content</label>

          <textarea
            id="contentEn"
            placeholder="Write English news..."
          ></textarea>

          <label>English Image</label>

          <input
            type="file"
            id="imageEn"
            accept="image/*"
          >

          <img
            id="previewEn"
            class="image-preview"
            alt="English preview"
          >

        </div>

      </div>


      <button
        id="publishBtn"
        class="publish"
      >
        🚀 Publish News
      </button>

      <div
        id="publishStatus"
        class="status"
      ></div>

    </div>


    <!-- OLD NEWS -->

    <div class="box">

      <h2>📚 Published News</h2>

      <div id="newsList">
        Loading published news...
      </div>

    </div>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

  /*
    ============================
    SUPABASE
    ============================
  */

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /*
    ============================
    ADMIN USER
    ============================
  */

  const ADMIN_EMAIL =
    "mdnaimeholder@gmail.com";


  /*
    ============================
    ELEMENTS
    ============================
  */

  const loginPanel =
    document.getElementById("loginPanel");

  const adminPanel =
    document.getElementById("adminPanel");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const loginBtn =
    document.getElementById("loginBtn");

  const loginStatus =
    document.getElementById("loginStatus");

  const publishBtn =
    document.getElementById("publishBtn");

  const publishStatus =
    document.getElementById("publishStatus");

  const newsList =
    document.getElementById("newsList");


  /*
    ============================
    STATUS
    ============================
  */

  function showStatus(element, message, type) {

    element.textContent = message;

    element.className =
      "status " + type;

    element.style.display = "block";
  }


  function hideStatus(element) {

    element.style.display = "none";

  }


  /*
    ============================
    LOGIN SCREEN
    ============================
  */

  function showLogin() {

    loginPanel.style.display = "block";

    adminPanel.style.display = "none";

    logoutBtn.style.display = "none";

  }


  function showAdmin() {

    loginPanel.style.display = "none";

    adminPanel.style.display = "block";

    logoutBtn.style.display = "block";

  }


  /*
    ============================
    CHECK SESSION
    ============================
  */

  async function checkSession() {

    const {
      data,
      error
    } = await db.auth.getSession();

    if (error) {

      console.error(error);

      showLogin();

      return;

    }

    const session =
      data?.session;

    const user =
      session?.user;


    if (
      user &&
      user.email &&
      user.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    ) {

      showAdmin();

      await loadNews();

    } else {

      showLogin();

    }

  }


  /*
    ============================
    LOGIN
    ============================
  */

  loginBtn.addEventListener(
    "click",
    async () => {

      hideStatus(loginStatus);

      const email =
        document.getElementById(
          "loginEmail"
        ).value.trim();

      const password =
        document.getElementById(
          "loginPassword"
        ).value;


      if (!email || !password) {

        showStatus(
          loginStatus,
          "Email এবং Password দিন।",
          "error"
        );

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "Logging in...";


      const {
        data,
        error
      } = await db.auth.signInWithPassword({

        email,
        password

      });


      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login";


      if (error) {

        console.error(
          "Login error:",
          error
        );

        showStatus(
          loginStatus,
          "Login failed: " +
          error.message,
          "error"
        );

        return;

      }


      if (
        !data.user ||
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        await db.auth.signOut();

        showStatus(
          loginStatus,
          "এই Account Admin Account নয়।",
          "error"
        );

        return;

      }


      showAdmin();

      await loadNews();

    }
  );


  /*
    ============================
    LOGOUT
    ============================
  */

  logoutBtn.addEventListener(
    "click",
    async () => {

      logoutBtn.disabled = true;

      logoutBtn.textContent =
        "Logging out...";


      const {
        error
      } = await db.auth.signOut();


      if (error) {

        console.error(
          "Logout error:",
          error
        );

        logoutBtn.disabled = false;

        logoutBtn.textContent =
          "Logout";

        alert(
          "Logout হয়নি: " +
          error.message
        );

        return;

      }


      /*
        Clear local Supabase session data
      */

      try {

        Object.keys(
          localStorage
        ).forEach(key => {

          if (
            key.includes("supabase") ||
            key.includes("auth-token")
          ) {

            localStorage.removeItem(key);

          }

        });

      } catch (e) {

        console.log(e);

      }


      showLogin();

      document.getElementById(
        "loginPassword"
      ).value = "";

      logoutBtn.disabled = false;

      logoutBtn.textContent =
        "Logout";

    }
  );


  /*
    ============================
    IMAGE PREVIEW
    ============================
  */

  function setupPreview(
    inputId,
    previewId
  ) {

    const input =
      document.getElementById(inputId);

    const preview =
      document.getElementById(previewId);


    input.addEventListener(
      "change",
      () => {

        const file =
          input.files?.[0];

        if (!file) {

          preview.style.display =
            "none";

          preview.src = "";

          return;

        }


        preview.src =
          URL.createObjectURL(file);

        preview.style.display =
          "block";

      }
    );

  }


  setupPreview(
    "imageBn",
    "previewBn"
  );

  setupPreview(
    "imageEn",
    "previewEn"
  );


  /*
    ============================
    UPLOAD IMAGE
    ============================
  */

  async function uploadImage(
    file,
    folder
  ) {

    if (!file) return null;


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const filename =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;


    const path =
      folder +
      "/" +
      filename;


    const {
      error
    } = await db.storage
      .from("news-images")
      .upload(
        path,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


    if (error) {

      throw error;

    }


    const {
      data
    } = db.storage
      .from("news-images")
      .getPublicUrl(path);


    return data.publicUrl;

  }


  /*
    ============================
    PUBLISH NEWS
    ============================
  */

  publishBtn.addEventListener(
    "click",
    async () => {

      hideStatus(publishStatus);


      const category =
        document.getElementById(
          "category"
        ).value;


      const titleBn =
        document.getElementById(
          "titleBn"
        ).value.trim();

      const contentBn =
        document.getElementById(
          "contentBn"
        ).value.trim();


      const titleEn =
        document.getElementById(
          "titleEn"
        ).value.trim();

      const contentEn =
        document.getElementById(
          "contentEn"
        ).value.trim();


      const imageBn =
        document.getElementById(
          "imageBn"
        ).files?.[0];

      const imageEn =
        document.getElementById(
          "imageEn"
        ).files?.[0];


      if (!titleBn) {

        showStatus(
          publishStatus,
          "বাংলা Title দিন।",
          "error"
        );

        return;

      }


      if (!contentBn) {

        showStatus(
          publishStatus,
          "বাংলা Content দিন।",
          "error"
        );

        return;

      }


      if (!titleEn) {

        showStatus(
          publishStatus,
          "English Title দিন।",
          "error"
        );

        return;

      }


      if (!contentEn) {

        showStatus(
          publishStatus,
          "English Content দিন।",
          "error"
        );

        return;

      }


      publishBtn.disabled = true;

      publishBtn.textContent =
        "Publishing...";


      try {

        /*
          Upload Bangla image
        */

        let imageBnUrl = null;

        if (imageBn) {

          imageBnUrl =
            await uploadImage(
              imageBn,
              "bangla"
            );

        }


        /*
          Upload English image
        */

        let imageEnUrl = null;

        if (imageEn) {

          imageEnUrl =
            await uploadImage(
              imageEn,
              "english"
            );

        }


        /*
          Insert news
        */

        const {
          error
        } = await db
          .from("news")
          .insert({

            category,

            title: titleBn,

            content: contentBn,

            image_url:
              imageBnUrl,

            title_bn:
              titleBn,

            content_bn:
              contentBn,

            image_bn:
              imageBnUrl,

            title_en:
              titleEn,

            content_en:
              contentEn,

            image_en:
              imageEnUrl

          });


        if (error) {

          throw error;

        }


        showStatus(
          publishStatus,
          "✅ News successfully published!",
          "success"
        );


        /*
          Clear form
        */

        document.getElementById(
          "titleBn"
        ).value = "";

        document.getElementById(
          "contentBn"
        ).value = "";

        document.getElementById(
          "titleEn"
        ).value = "";

        document.getElementById(
          "contentEn"
        ).value = "";

        document.getElementById(
          "imageBn"
        ).value = "";

        document.getElementById(
          "imageEn"
        ).value = "";


        document.getElementById(
          "previewBn"
        ).style.display = "none";

        document.getElementById(
          "previewEn"
        ).style.display = "none";


        await loadNews();

      } catch (error) {

        console.error(
          "Publish error:",
          error
        );

        showStatus(
          publishStatus,
          "❌ Publish failed: " +
          error.message,
          "error"
        );

      }


      publishBtn.disabled = false;

      publishBtn.textContent =
        "🚀 Publish News";

    }
  );


  /*
    ============================
    LOAD OLD NEWS
    ============================
  */

  async function loadNews() {

    newsList.innerHTML =
      "Loading published news...";


    const {
      data,
      error
    } = await db
      .from("news")
      .select(
        "id,title,title_bn,title_en,category,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(
        "Load news error:",
        error
      );

      newsList.innerHTML = `
        <div class="status error" style="display:block;">
          ❌ News load হয়নি.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;

    }


    if (!data || data.length === 0) {

      newsList.innerHTML = `
        <div class="empty">
          এখনো কোনো News Publish করা হয়নি।
        </div>
      `;

      return;

    }


    newsList.innerHTML =
      data.map(
        news => {

          const bn =
            news.title_bn ||
            news.title ||
            "No Bangla Title";

          const en =
            news.title_en ||
            "No English Title";


          const date =
            news.created_at
              ? new Date(
                  news.created_at
                ).toLocaleString(
                  "en-GB"
                )
              : "";


          return `
            <div
              class="news-item"
              id="news-item-${news.id}"
            >

              <h3>
                🇧🇩 ${escapeHtml(bn)}
              </h3>

              <div>
                🇬🇧 ${escapeHtml(en)}
              </div>

              <div class="news-meta">
                ${escapeHtml(
                  news.category || "SPORTS"
                )}
                •
                ${escapeHtml(date)}
                • ID:
                ${escapeHtml(news.id)}
              </div>

              <button
                class="delete"
                onclick="deleteNews(${Number(news.id)})"
              >
                🗑️ Delete
              </button>

            </div>
          `;

        }
      ).join("");

  }


  /*
    ============================
    DELETE NEWS
    ============================
  */

  async function deleteNews(id) {

    const confirmDelete =
      confirm(
        "এই News টি কি সত্যিই Delete করতে চান?"
      );


    if (!confirmDelete) return;


    const {
      error
    } = await db
      .from("news")
      .delete()
      .eq("id", id);


    if (error) {

      console.error(
        "Delete error:",
        error
      );

      alert(
        "Delete হয়নি: " +
        error.message
      );

      return;

    }


    const item =
      document.getElementById(
        `news-item-${id}`
      );


    if (item) {

      item.remove();

    }


    if (
      !newsList.querySelector(
        ".news-item"
      )
    ) {

      newsList.innerHTML = `
        <div class="empty">
          এখন আর কোনো Published News নেই।
        </div>
      `;

    }

  }


  /*
    ============================
    ESCAPE HTML
    ============================
  */

  function escapeHtml(value) {

    return String(
      value ?? ""
    ).replace(
      /[&<>'"]/g,
      function(char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"

        }[char];

      }
    );

  }


  /*
    ============================
    AUTH STATE LISTENER
    ============================
  */

  db.auth.onAuthStateChange(
    async (
      event,
      session
    ) => {

      if (
        event === "SIGNED_OUT"
      ) {

        showLogin();

        return;

      }


      if (
        event === "SIGNED_IN" &&
        session?.user
      ) {

        if (
          session.user.email
            .toLowerCase() ===
          ADMIN_EMAIL.toLowerCase()
        ) {

          showAdmin();

          await loadNews();

        }

      }

    }
  );


  /*
    ============================
    START
    ============================
  */

  checkSession();

</script>

</body>
  </html>
