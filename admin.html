<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPORTNEXIA Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><div class="brand">SPORT<span>NEXIA</span> <small>ADMIN</small></div><section id="loginBox" class="panel"><h1>Admin Login</h1><p>Private publishing panel.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button><div id="msg"></div></section><section id="app" class="panel hidden"><div class="top"><div><h1>Publish News</h1><p>Only the authorized Sportnexia account can publish.</p></div><button id="logout" class="secondary">Logout</button></div><form id="newsForm"><input id="title" placeholder="News title" required><select id="category"><option>Football</option><option>Cricket</option><option>Sports</option></select><textarea id="content" placeholder="News content" rows="8" required></textarea><label class="file">Featured image<input id="image" type="file" accept="image/*"></label><button type="submit">Publish News</button><div id="status"></div></form><h2>Your Published News</h2><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
