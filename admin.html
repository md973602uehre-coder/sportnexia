<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>SPORTNEXIA Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .admin-header {
      background: #071426;
      color: #fff;
      padding: 18px 20px;
    }

    .admin-header-inner {
      max-width: 950px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      color: #fff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span {
      color: #238cff;
    }

    .logout-button {
      border: 0;
      background: #ef4444;
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .admin-container {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .admin-card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .admin-title {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .admin-subtitle {
      margin: 0 0 28px;
      color: #6b7280;
    }

    .language-section {
      margin-top: 25px;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #fafbfc;
    }

    .language-title {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .bangla-title {
      color: #008f5a;
    }

    .english-title {
      color: #238cff;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #238cff;
      box-shadow: 0 0 0 3px rgba(35,140,255,.10);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    .image-preview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 12px;
      background: #f1f3f6;
    }

    .publish-area {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .publish-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #238cff;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .publish-button:hover {
      background: #147be8;
    }

    .publish-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      font-weight: 700;
    }

    .status-success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .required {
      color: #ef4444;
    }

    /* PUBLISHED NEWS */

    .published-title {
      margin: 0 0 20px;
      font-size: 27px;
    }

    .news-list {
      display: grid;
      gap: 14px;
    }

    .admin-news-item {
      border: 1px solid #e1e5eb;
      border-radius: 14px;
      padding: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      background: #fafbfc;
    }

    .admin-news-info {
      min-width: 0;
    }

    .admin-news-category {
      display: inline-block;
      color: #238cff;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .admin-news-item h3 {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .admin-news-date {
      color: #7b8493;
      font-size: 12px;
    }

    .delete-button {
      flex: 0 0 auto;
      border: 0;
      background: #fee2e2;
      color: #dc2626;
      padding: 10px 13px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    .delete-button:hover {
      background: #dc2626;
      color: #fff;
    }

    .empty-news {
      padding: 25px;
      text-align: center;
      color: #7b8493;
      border: 1px dashed #d7dce4;
      border-radius: 12px;
    }

    .loading-news {
      color: #7b8493;
    }

    @media (max-width: 600px) {

      .admin-card {
        padding: 18px;
      }

      .admin-title {
        font-size: 25px;
      }

      .admin-news-item {
        align-items: flex-start;
      }

      .admin-news-item h3 {
        white-space: normal;
      }

      .delete-button {
        padding: 9px 11px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header class="admin-header">

    <div class="admin-header-inner">

      <a
        href="index.html"
        class="brand"
      >
        SPORT<span>NEXIA</span>
      </a>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="admin-container">


    <!-- PUBLISH NEWS -->

    <section class="admin-card">

      <h1 class="admin-title">
        Publish News
      </h1>

      <p class="admin-subtitle">
        Publish Bengali and English versions together.
      </p>


      <!-- CATEGORY -->

      <label for="category">
        Category
        <span class="required">*</span>
      </label>

      <select id="category">

        <option value="Football">
          Football
        </option>

        <option value="Cricket">
          Cricket
        </option>

        <option value="Sports">
          Sports
        </option>

      </select>


      <!-- BANGLA -->

      <section class="language-section">

        <h2 class="language-title bangla-title">
          🇧🇩 বাংলা নিউজ
        </h2>


        <label for="title_bn">
          বাংলা শিরোনাম
          <span class="required">*</span>
        </label>

        <input
          id="title_bn"
          type="text"
          placeholder="বাংলা নিউজের শিরোনাম লিখুন"
        >


        <label for="content_bn">
          বাংলা নিউজ
          <span class="required">*</span>
        </label>

        <textarea
          id="content_bn"
          placeholder="বাংলা নিউজের বিস্তারিত লিখুন"
        ></textarea>


        <label for="image_bn">
          বাংলা নিউজের ছবি
        </label>

        <input
          id="image_bn"
          type="file"
          accept="image/*"
        >

        <img
          id="imageBnPreview"
          class="image-preview"
          alt="Bangla image preview"
        >

      </section>


      <!-- ENGLISH -->

      <section class="language-section">

        <h2 class="language-title english-title">
          🇬🇧 English News
        </h2>


        <label for="title_en">
          English Title
          <span class="required">*</span>
        </label>

        <input
          id="title_en"
          type="text"
          placeholder="Enter English news title"
        >


        <label for="content_en">
          English News
          <span class="required">*</span>
        </label>

        <textarea
          id="content_en"
          placeholder="Write English news content"
        ></textarea>


        <label for="image_en">
          English News Image
        </label>

        <input
          id="image_en"
          type="file"
          accept="image/*"
        >

        <img
          id="imageEnPreview"
          class="image-preview"
          alt="English image preview"
        >

      </section>


      <!-- PUBLISH -->

      <div class="publish-area">

        <button
          id="publishButton"
          class="publish-button"
          type="button"
        >
          🚀 Publish News
        </button>

        <div
          id="statusMessage"
          class="status-message"
        ></div>

      </div>

    </section>


    <!-- PUBLISHED NEWS -->

    <section class="admin-card">

      <h2 class="published-title">
        📰 Published News
      </h2>

      <div
        id="newsList"
        class="news-list"
      >

        <div class="loading-news">
          Loading published news...
        </div>

      </div>

    </section>


  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <!-- Cache-busted admin.js -->
  <script src="admin.js?v=3"></script>


</body>

</html>
