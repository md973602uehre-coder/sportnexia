<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPORTNEXIA Admin Panel</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#26364e;--text:#eef4ff;--muted:#9db0ca;--blue:#3182f6;--red:#e5484d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px;background:#101a2b;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:20px;margin:0}main{max-width:900px;margin:22px auto;padding:0 14px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}h2{margin:0 0 14px;font-size:19px}
label{display:block;margin:12px 0 6px;color:#dce7f7;font-size:14px}
input,textarea,select{width:100%;border:1px solid #354862;border-radius:8px;background:#091321;color:var(--text);padding:11px;font:inherit}
textarea{min-height:120px;resize:vertical}button{border:0;border-radius:8px;padding:11px 15px;background:var(--blue);color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.secondary{background:#354862}.danger{background:var(--red)}
.status{margin-top:12px;min-height:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.news-item{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
.news-title{overflow-wrap:anywhere}img.preview{display:block;max-width:100%;max-height:220px;margin-top:8px;border-radius:8px}
@media(max-width:650px){.grid{grid-template-columns:1fr}header h1{font-size:17px}.panel{padding:14px}}
</style>
</head>
<body>
<header><h1>SPORTNEXIA Admin Panel</h1><button id="logoutBtn" class="secondary hidden" type="button">Logout</button></header>
<main>
<section id="loginPanel" class="panel">
<h2>Admin Login</h2><p class="muted">শুধুমাত্র অনুমোদিত Admin অ্যাকাউন্ট দিয়ে লগইন করো।</p>
<form id="loginForm">
<label for="email">Admin Email</label><input id="email" type="email" autocomplete="username" value="mdnaimeholader02@gmail.com" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">Login</button><div id="loginStatus" class="status" role="status" aria-live="polite"></div>
</form></section>
<section id="adminPanel" class="hidden">
<div class="panel"><h2>News Publish</h2><div id="userInfo" class="muted"></div>
<label for="category">Category</label><select id="category"><option value="football">Football</option><option value="cricket">Cricket</option><option value="sports">Sports</option></select>
<div class="grid"><div>
<label for="titleBn">বাংলা শিরোনাম</label><input id="titleBn" type="text" placeholder="বাংলা শিরোনাম লিখুন">
<label for="contentBn">বাংলা খবর</label><textarea id="contentBn" placeholder="বাংলায় খবর লিখুন"></textarea>
<label for="imageBn">বাংলা ছবির ফাইল (ঐচ্ছিক)</label><input id="imageBn" type="file" accept="image/*"><img id="previewBn" class="preview hidden" alt="বাংলা ছবির প্রিভিউ">
</div><div>
<label for="titleEn">English title</label><input id="titleEn" type="text" placeholder="English headline">
<label for="contentEn">English news</label><textarea id="contentEn" placeholder="Write news in English"></textarea>
<label for="imageEn">English image file (optional)</label><input id="imageEn" type="file" accept="image/*"><img id="previewEn" class="preview hidden" alt="English image preview">
</div></div>
<button id="publishBtn" type="button">Publish News</button><div id="publishStatus" class="status" role="status" aria-live="polite"></div>
</div>
<div class="panel"><h2>Published News</h2><button id="refreshBtn" class="secondary" type="button">Refresh News</button><div id="newsList" style="margin-top:10px"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
(() => {
"use strict";
// Unique name avoids redeclaring ADMIN_UID from config.js.
const EXPECTED_ADMIN_UID = "1d524237-7533-4d6b-a282-f5282d92b299";
const EXPECTED_ADMIN_EMAIL = "mdnaimeholader02@gmail.com";
const $ = id => document.getElementById(id);
const loginPanel=$("loginPanel"),adminPanel=$("adminPanel"),loginForm=$("loginForm"),loginBtn=$("loginBtn"),loginStatus=$("loginStatus"),logoutBtn=$("logoutBtn"),publishBtn=$("publishBtn"),publishStatus=$("publishStatus");
let db=null,authBusy=false,publishBusy=false;
function status(el,msg,isError=false){el.textContent=msg;el.style.color=isError?"#ff8e92":"#80e3b8"}
function showLogin(msg=""){loginPanel.classList.remove("hidden");adminPanel.classList.add("hidden");logoutBtn.classList.add("hidden");if(msg)status(loginStatus,msg,true)}
function showAdmin(user){loginPanel.classList.add("hidden");adminPanel.classList.remove("hidden");logoutBtn.classList.remove("hidden");$("userInfo").textContent="Logged in as: "+(user.email||"Admin")}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function checkConfig(){
 if(!window.supabase||typeof window.supabase.createClient!=="function")throw new Error("Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট চালু করে পেজ Reload করো।");
 if(typeof SUPABASE_URL==="undefined"||typeof SUPABASE_PUBLISHABLE_KEY==="undefined"||!SUPABASE_URL||!SUPABASE_PUBLISHABLE_KEY)throw new Error("config.js থেকে Supabase configuration পাওয়া যায়নি।");
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
}
async function verifyAdmin(){
 const {data,error}=await db.auth.getUser();if(error)throw error;const user=data&&data.user;
 if(!user)throw new Error("লগইন সেশন পাওয়া যায়নি। আবার Login করো।");
 if(user.id!==EXPECTED_ADMIN_UID||String(user.email||"").toLowerCase()!==EXPECTED_ADMIN_EMAIL){await db.auth.signOut();throw new Error("এই অ্যাকাউন্টটি Admin হিসেবে অনুমোদিত নয়। UID ও Email যাচাই করো।")}
 return user;
}
async function handleLogin(event){
 event.preventDefault();if(authBusy)return;authBusy=true;loginBtn.disabled=true;loginBtn.textContent="Logging in...";status(loginStatus,"লগইন যাচাই করা হচ্ছে...");
 try{
  if(!db)checkConfig();const email=$("email").value.trim().toLowerCase(),password=$("password").value;
  if(email!==EXPECTED_ADMIN_EMAIL)throw new Error("Admin Email সঠিক নয়।");
  const {error:outError}=await db.auth.signOut();if(outError)console.warn("Previous sign-out warning:",outError.message);
  const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
  const user=await verifyAdmin();showAdmin(user);status(loginStatus,"");await loadNews();
 }catch(e){console.error("Admin login error:",e);showLogin(e.message||"লগইন করা যায়নি। আবার চেষ্টা করো।")}
 finally{authBusy=false;loginBtn.disabled=false;loginBtn.textContent="Login"}
}
async function handleLogout(){if(!db)return showLogin();const {error}=await db.auth.signOut();if(error)status(loginStatus,"Logout সমস্যা: "+error.message,true);showLogin("তুমি Logout করেছ।")}
function previewFile(inputId,previewId){
 const file=$(inputId).files&&$(inputId).files[0],img=$(previewId);if(!file){img.removeAttribute("src");img.classList.add("hidden");return}
 if(!file.type.startsWith("image/")){status(publishStatus,"শুধু image ফাইল আপলোড করা যাবে।",true);$(inputId).value="";return}
 img.src=URL.createObjectURL(file);img.classList.remove("hidden")
}
async function uploadImage(inputId){
 const file=$(inputId).files&&$(inputId).files[0];if(!file)return null;if(!file.type.startsWith("image/"))throw new Error("শুধু image ফাইল আপলোড করা যাবে।");
 const name=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+name;
 const {data,error}=await db.storage.from("news-images").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});
 if(error)throw new Error("ছবি Upload হয়নি: "+error.message+" (news-images bucket ও policy যাচাই করো)");
 return db.storage.from("news-images").getPublicUrl(data.path).data.publicUrl;
}
async function handlePublish(){
 if(publishBusy)return;publishBusy=true;publishBtn.disabled=true;publishBtn.textContent="Publishing...";
 try{
  await verifyAdmin();const title_bn=$("titleBn").value.trim(),content_bn=$("contentBn").value.trim(),title_en=$("titleEn").value.trim(),content_en=$("contentEn").value.trim(),category=$("category").value;
  if(!title_bn||!content_bn||!title_en||!content_en)throw new Error("বাংলা ও English—দুই ভাষার শিরোনাম এবং খবর পূরণ করো।");
  status(publishStatus,"খবর Publish হচ্ছে...");const image_bn=await uploadImage("imageBn"),image_en=await uploadImage("imageEn");
  const row={title:title_en,title_bn,title_en,content:content_en,content_bn,content_en,category,image:image_en||image_bn,image_bn,image_en};
  const {error}=await db.from("news").insert(row);if(error)throw error;
  status(publishStatus,"খবর সফলভাবে Publish হয়েছে।");
  ["titleBn","contentBn","titleEn","contentEn","imageBn","imageEn"].forEach(id=>$(id).value="");
  ["previewBn","previewEn"].forEach(id=>{$(id).removeAttribute("src");$(id).classList.add("hidden")});await loadNews();
 }catch(e){console.error("Publish error:",e);status(publishStatus,e.message||"খবর Publish করা যায়নি।",true)}
 finally{publishBusy=false;publishBtn.disabled=false;publishBtn.textContent="Publish News"}
}
async function loadNews(){
 const list=$("newsList");list.textContent="খবর লোড হচ্ছে...";
 try{
  await verifyAdmin();const {data,error}=await db.from("news").select("id,title,title_bn,title_en,category,created_at").order("created_at",{ascending:false}).limit(100);if(error)throw error;
  if(!data||!data.length){list.textContent="এখনও কোনো খবর নেই।";return}
  list.innerHTML=data.map(item=>`<div class="news-item"><div class="news-title"><strong>${escapeHtml(item.title_bn||item.title_en||item.title||"Untitled")}</strong><div class="muted">${escapeHtml(item.category||"")} · ID: ${escapeHtml(item.id)}</div></div><button class="danger" type="button" data-delete-id="${escapeHtml(item.id)}">Delete</button></div>`).join("");
 }catch(e){console.error("Load news error:",e);list.textContent="খবর লোড হয়নি: "+(e.message||"Unknown error")}
}
async function handleDelete(id,button){
 if(!confirm("এই খবরটি Delete করতে চাও?"))return;button.disabled=true;
 try{await verifyAdmin();const {error}=await db.from("news").delete().eq("id",id);if(error)throw error;await loadNews()}
 catch(e){alert("Delete করা যায়নি: "+(e.message||"Unknown error"));button.disabled=false}
}
loginForm.addEventListener("submit",handleLogin);logoutBtn.addEventListener("click",handleLogout);publishBtn.addEventListener("click",handlePublish);$("refreshBtn").addEventListener("click",loadNews);
$("imageBn").addEventListener("change",()=>previewFile("imageBn","previewBn"));$("imageEn").addEventListener("change",()=>previewFile("imageEn","previewEn"));
$("newsList").addEventListener("click",event=>{const b=event.target.closest("[data-delete-id]");if(b)handleDelete(b.getAttribute("data-delete-id"),b)});
try{
 checkConfig();
 db.auth.getSession().then(async({data,error})=>{
  if(error)throw error;if(data.session){try{const user=await verifyAdmin();showAdmin(user);await loadNews()}catch(e){console.warn("Existing session is not admin:",e.message);await db.auth.signOut();showLogin("আগের সেশনটি Admin নয়। আবার Login করো।")}}else showLogin();
 }).catch(e=>{console.error("Session check error:",e);showLogin("Session check সমস্যা: "+(e.message||"Unknown error"))});
}catch(e){console.error("Configuration error:",e);showLogin("Configuration সমস্যা: "+(e.message||"Unknown error"))}
})();
</script>
</body>
</html>
