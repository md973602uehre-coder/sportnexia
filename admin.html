<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPORTNEXIA Admin Panel</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f3f5f7;
      color:#111827;
    }

    header{
      background:#07111f;
      color:#fff;
      padding:18px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:23px;
    }

    header span{
      color:#38bdf8;
    }

    button{
      border:0;
      border-radius:8px;
      padding:11px 16px;
      font-weight:700;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .logout{
      background:#ef4444;
      color:#fff;
    }

    .container{
      width:min(1000px,94%);
      margin:25px auto;
    }

    .box{
      background:#fff;
      padding:22px;
      border-radius:14px;
      margin-bottom:22px;
      box-shadow:0 5px 20px rgba(0,0,0,.06);
    }

    #loginPanel{
      width:min(500px,94%);
      margin:70px auto;
    }

    #adminPanel{
      display:none;
    }

    label{
      display:block;
      margin:14px 0 7px;
      font-weight:700;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:12px;
      border:1px solid #d1d5db;
      border-radius:8px;
      font-size:15px;
      outline:none;
    }

    textarea{
      min-height:130px;
      resize:vertical;
    }

    .loginBtn,
    .publishBtn{
      width:100%;
      margin-top:18px;
      background:#0284c7;
      color:#fff;
      font-size:16px;
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
    }

    .sectionTitle{
      border-left:4px solid #0284c7;
      padding-left:10px;
    }

    .preview{
      display:none;
      width:100%;
      max-height:220px;
      object-fit:contain;
      margin-top:10px;
      border-radius:10px;
      background:#eee;
    }

    .status{
      display:none;
      padding:12px;
      margin-top:12px;
      border-radius:8px;
      word-break:break-word;
    }

    .success{
      background:#dcfce7;
      color:#166534;
    }

    .error{
      background:#fee2e2;
      color:#991b1b;
    }

    .news{
      border:1px solid #ddd;
      background:#fafafa;
      padding:15px;
      border-radius:10px;
      margin-top:12px;
    }

    .delete{
      background:#dc2626;
      color:#fff;
      margin-top:10px;
    }

    .meta{
      color:#6b7280;
      font-size:13px;
      margin-top:8px;
    }

    .info{
      background:#eff6ff;
      color:#1e40af;
      padding:12px;
      border-radius:8px;
      margin-top:12px;
      font-size:14px;
    }

    .userInfo{
      background:#f0fdf4;
      color:#166534;
      padding:12px;
      border-radius:8px;
      margin-top:12px;
      font-size:13px;
      word-break:break-all;
    }

    @media(max-width:700px){
      .two{
        grid-template-columns:1fr;
      }

      header{
        gap:12px;
      }

      header h1{
        font-size:19px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>
    SPORT<span>NEXIA</span> Admin Panel
  </h1>

  <button
    id="logoutBtn"
    class="logout"
    style="display:none;"
  >
    Logout
  </button>

</header>


<!-- LOGIN -->

<div
  id="loginPanel"
  class="box"
>

  <h2>🔐 Admin Login</h2>

  <p>
    SPORTNEXIA Admin Panel-এ প্রবেশ করুন।
  </p>

  <label>Email</label>

  <input
    id="email"
    type="email"
    value="mdnaimeholader02@gmail.com"
    autocomplete="email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="loginBtn"
  >
    Login
  </button>

  <div
    id="loginStatus"
    class="status"
  ></div>

</div>


<!-- ADMIN -->

<div
  id="adminPanel"
>

  <div class="container">


    <!-- PUBLISH -->

    <div class="box">

      <h2>📰 Publish News</h2>

      <div class="info">
        Admin: mdnaimeholader02@gmail.com
      </div>

      <div
        id="userInfo"
        class="userInfo"
      >
        Checking admin session...
      </div>


      <label>
        Category
      </label>

      <select id="category">

        <option value="Football">
          Football
        </option>

        <option value="Cricket">
          Cricket
        </option>

        <option value="Sports">
          Sports
        </option>

      </select>


      <div class="two">


        <!-- BANGLA -->

        <div>

          <h3 class="sectionTitle">
            🇧🇩 বাংলা
          </h3>

          <label>
            বাংলা Title
          </label>

          <input
            id="titleBn"
            type="text"
            placeholder="বাংলা শিরোনাম"
          >

          <label>
            বাংলা Content
          </label>

          <textarea
            id="contentBn"
            placeholder="বাংলা নিউজ লিখুন..."
          ></textarea>

          <label>
            বাংলা Image
          </label>

          <input
            id="imageBn"
            type="file"
            accept="image/*"
          >

          <img
            id="previewBn"
            class="preview"
            alt="Bangla preview"
          >

        </div>


        <!-- ENGLISH -->

        <div>

          <h3 class="sectionTitle">
            🇬🇧 English
          </h3>

          <label>
            English Title
          </label>

          <input
            id="titleEn"
            type="text"
            placeholder="English headline"
          >

          <label>
            English Content
          </label>

          <textarea
            id="contentEn"
            placeholder="Write English news..."
          ></textarea>

          <label>
            English Image
          </label>

          <input
            id="imageEn"
            type="file"
            accept="image/*"
          >

          <img
            id="previewEn"
            class="preview"
            alt="English preview"
          >

        </div>

      </div>


      <button
        id="publishBtn"
        class="publishBtn"
      >
        🚀 Publish News
      </button>

      <div
        id="publishStatus"
        class="status"
      ></div>

    </div>


    <!-- PUBLISHED NEWS -->

    <div class="box">

      <h2>
        📚 Published News
      </h2>

      <div id="newsList">
        Loading published news...
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

/* ========================================
   SUPABASE
======================================== */

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ========================================
   ADMIN
======================================== */

const ADMIN_EMAIL =
  "mdnaimeholader02@gmail.com";

const ADMIN_UID =
  "1d524237-7533-4d6b-a282-f5282d92b299";


/* ========================================
   ELEMENTS
======================================== */

const loginPanel =
  document.getElementById("loginPanel");

const adminPanel =
  document.getElementById("adminPanel");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginStatus =
  document.getElementById("loginStatus");

const publishBtn =
  document.getElementById("publishBtn");

const publishStatus =
  document.getElementById("publishStatus");

const newsList =
  document.getElementById("newsList");

const userInfo =
  document.getElementById("userInfo");


/* ========================================
   STATUS
======================================== */

function showStatus(
  element,
  message,
  type
){

  element.textContent =
    message;

  element.className =
    "status " + type;

  element.style.display =
    "block";
}


/* ========================================
   SHOW LOGIN
======================================== */

function showLogin(){

  loginPanel.style.display =
    "block";

  adminPanel.style.display =
    "none";

  logoutBtn.style.display =
    "none";
}


/* ========================================
   SHOW ADMIN
======================================== */

function showAdmin(){

  loginPanel.style.display =
    "none";

  adminPanel.style.display =
    "block";

  logoutBtn.style.display =
    "block";
}


/* ========================================
   VERIFY USER
======================================== */

function isAdminUser(user){

  if(!user){
    return false;
  }

  if(!user.email){
    return false;
  }

  if(
    user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    return false;
  }

  if(
    user.id !==
    ADMIN_UID
  ){

    return false;
  }

  return true;
}


/* ========================================
   GET VERIFIED USER
======================================== */

async function getVerifiedAdmin(){

  /*
    Server-side user check
    getUser() is stronger than
    relying only on local session.
  */

  const {
    data,
    error
  } =
    await db.auth.getUser();

  if(error){
    throw error;
  }

  const user =
    data?.user;

  if(!user){

    throw new Error(
      "Admin session পাওয়া যায়নি। আবার Login করুন।"
    );

  }

  if(
    user.id !==
    ADMIN_UID
  ){

    await db.auth.signOut();

    throw new Error(
      "এই Login account-এর Admin UID সঠিক নয়। আবার নতুন Admin account দিয়ে Login করুন।"
    );

  }

  if(
    user.email?.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await db.auth.signOut();

    throw new Error(
      "Admin Email সঠিক নয়।"
    );

  }

  return user;
}


/* ========================================
   UPDATE USER INFO
======================================== */

function updateUserInfo(user){

  if(!userInfo){
    return;
  }

  userInfo.innerHTML =
    "✅ Admin verified<br>" +
    "Email: " +
    escapeHtml(user.email) +
    "<br>" +
    "UID: " +
    escapeHtml(user.id);

}


/* ========================================
   LOGIN
======================================== */

loginBtn.onclick =
async function(){

  loginBtn.disabled =
    true;

  loginBtn.textContent =
    "Logging in...";

  loginStatus.style.display =
    "none";


  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(
    email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    showStatus(
      loginStatus,
      "শুধু SPORTNEXIA Admin Email ব্যবহার করুন।",
      "error"
    );

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "Login";

    return;
  }


  try{

    /*
      Remove any stale session first.
    */

    await db.auth.signOut();


    const {
      data,
      error
    } =
    await db.auth.signInWithPassword({

      email:
        email,

      password:
        password

    });


    if(error){
      throw error;
    }


    if(!data?.session){
      throw new Error(
        "Login session তৈরি হয়নি।"
      );
    }


    /*
      Server verification
    */

    const user =
      await getVerifiedAdmin();


    updateUserInfo(user);

    showAdmin();

    await loadNews();


    showStatus(
      loginStatus,
      "",
      "success"
    );


  }catch(error){

    console.error(
      "Login error:",
      error
    );

    await db.auth.signOut();

    showLogin();

    showStatus(
      loginStatus,
      "❌ Login failed: " +
      error.message,
      "error"
    );

  }


  loginBtn.disabled =
    false;

  loginBtn.textContent =
    "Login";

};


/* ========================================
   LOGOUT
======================================== */

logoutBtn.onclick =
async function(){

  logoutBtn.disabled =
    true;

  logoutBtn.textContent =
    "Logging out...";


  try{

    await db.auth.signOut();

  }catch(error){

    console.error(
      "Logout error:",
      error
    );

  }


  document.getElementById(
    "password"
  ).value = "";


  showLogin();


  logoutBtn.disabled =
    false;

  logoutBtn.textContent =
    "Logout";

};


/* ========================================
   SESSION CHECK
======================================== */

async function checkSession(){

  try{

    /*
      First check local session.
    */

    const {
      data,
      error
    } =
    await db.auth.getSession();


    if(error){
      throw error;
    }


    const session =
      data?.session;


    if(!session){

      showLogin();

      return;

    }


    /*
      Verify directly with Supabase server.
    */

    const user =
      await getVerifiedAdmin();


    updateUserInfo(user);

    showAdmin();

    await loadNews();


  }catch(error){

    console.log(
      "No valid admin session:",
      error.message
    );

    await db.auth.signOut();

    showLogin();

  }

}


/* ========================================
   AUTH STATE
======================================== */

db.auth.onAuthStateChange(
  function(
    event,
    session
  ){

    if(
      event ===
      "SIGNED_OUT"
    ){

      showLogin();

    }

  }
);


/* ========================================
   IMAGE PREVIEW
======================================== */

function setupPreview(
  inputId,
  previewId
){

  const input =
    document.getElementById(
      inputId
    );

  const preview =
    document.getElementById(
      previewId
    );


  input.addEventListener(
    "change",
    function(){

      const file =
        input.files[0];


      if(!file){

        preview.src =
          "";

        preview.style.display =
          "none";

        return;

      }


      preview.src =
        URL.createObjectURL(
          file
        );

      preview.style.display =
        "block";

    }
  );

}


setupPreview(
  "imageBn",
  "previewBn"
);

setupPreview(
  "imageEn",
  "previewEn"
);


/* ========================================
   UPLOAD IMAGE
======================================== */

async function uploadImage(
  file,
  folder
){

  if(!file){
    return null;
  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filename =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const path =
    folder +
    "/" +
    filename;


  const {
    error
  } =
  await db.storage
    .from("news-images")
    .upload(
      path,
      file,
      {
        cacheControl:"3600",
        upsert:false
      }
    );


  if(error){
    throw error;
  }


  const {
    data
  } =
  db.storage
    .from("news-images")
    .getPublicUrl(
      path
    );


  return data.publicUrl;

}


/* ========================================
   PUBLISH
======================================== */

publishBtn.onclick =
async function(){

  publishBtn.disabled =
    true;

  publishBtn.textContent =
    "Publishing...";

  publishStatus.style.display =
    "none";


  try{

    /*
      IMPORTANT:
      Verify the current Supabase user
      immediately before publishing.
    */

    const user =
      await getVerifiedAdmin();


    updateUserInfo(user);


    const category =
      document
        .getElementById("category")
        .value;


    const titleBn =
      document
        .getElementById("titleBn")
        .value
        .trim();


    const contentBn =
      document
        .getElementById("contentBn")
        .value
        .trim();


    const titleEn =
      document
        .getElementById("titleEn")
        .value
        .trim();


    const contentEn =
      document
        .getElementById("contentEn")
        .value
        .trim();


    const fileBn =
      document
        .getElementById("imageBn")
        .files[0];


    const fileEn =
      document
        .getElementById("imageEn")
        .files[0];


    if(
      !titleBn ||
      !contentBn
    ){

      throw new Error(
        "বাংলা Title এবং Content দিন।"
      );

    }


    if(
      !titleEn ||
      !contentEn
    ){

      throw new Error(
        "English Title এবং Content দিন।"
      );

    }


    /*
      Upload images
    */

    const imageBnUrl =
      await uploadImage(
        fileBn,
        "bangla"
      );


    const imageEnUrl =
      await uploadImage(
        fileEn,
        "english"
      );


    /*
      Insert news
    */

    const {
      error
    } =
    await db
      .from("news")
      .insert({

        category:
          category,

        title:
          titleBn,

        content:
          contentBn,

        image_url:
          imageBnUrl,

        title_bn:
          titleBn,

        content_bn:
          contentBn,

        image_bn:
          imageBnUrl,

        title_en:
          titleEn,

        content_en:
          contentEn,

        image_en:
          imageEnUrl

      });


    if(error){

      throw error;

    }


    showStatus(
      publishStatus,
      "✅ News successfully published!",
      "success"
    );


    /*
      Clear form
    */

    document.getElementById(
      "titleBn"
    ).value = "";

    document.getElementById(
      "contentBn"
    ).value = "";

    document.getElementById(
      "titleEn"
    ).value = "";

    document.getElementById(
      "contentEn"
    ).value = "";

    document.getElementById(
      "imageBn"
    ).value = "";

    document.getElementById(
      "imageEn"
    ).value = "";


    document.getElementById(
      "previewBn"
    ).style.display =
      "none";

    document.getElementById(
      "previewEn"
    ).style.display =
      "none";


    await loadNews();


  }catch(error){

    console.error(
      "Publish error:",
      error
    );

    showStatus(
      publishStatus,
      "❌ " +
      error.message,
      "error"
    );

  }


  publishBtn.disabled =
    false;

  publishBtn.textContent =
    "🚀 Publish News";

};


/* ========================================
   LOAD NEWS
======================================== */

async function loadNews(){

  newsList.innerHTML =
    "Loading published news...";


  const {
    data,
    error
  } =
  await db
    .from("news")
    .select(
      "id,title,title_bn,title_en,category,created_at"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "News load error:",
      error
    );


    newsList.innerHTML = `

      <div
        class="status error"
        style="display:block"
      >

        ❌ News load হয়নি:

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    newsList.innerHTML = `

      <div>
        এখনো কোনো Published News নেই।
      </div>

    `;

    return;

  }


  newsList.innerHTML =
    data
      .map(
        news => {

          const bn =
            news.title_bn ||
            news.title ||
            "No Bangla Title";


          const en =
            news.title_en ||
            "No English Title";


          const date =
            news.created_at
              ? new Date(
                  news.created_at
                ).toLocaleString(
                  "en-GB"
                )
              : "";


          return `

            <div
              class="news"
              id="news-${news.id}"
            >

              <h3>
                🇧🇩
                ${escapeHtml(bn)}
              </h3>

              <div>
                🇬🇧
                ${escapeHtml(en)}
              </div>

              <div class="meta">

                ${escapeHtml(
                  news.category ||
                  "SPORTS"
                )}

                •
                ${escapeHtml(date)}

              </div>

              <button
                class="delete"
                onclick="deleteNews(${Number(news.id)})"
              >
                🗑️ Delete
              </button>

            </div>

          `;

        }
      )
      .join("");

}


/* ========================================
   DELETE NEWS
======================================== */

async function deleteNews(id){

  const confirmDelete =
    confirm(
      "এই News টি Delete করতে চান?"
    );


  if(!confirmDelete){
    return;
  }


  try{

    /*
      Verify admin before delete.
    */

    await getVerifiedAdmin();


    const {
      error
    } =
    await db
      .from("news")
      .delete()
      .eq(
        "id",
        id
      );


    if(error){
      throw error;
    }


    const item =
      document.getElementById(
        "news-" + id
      );


    if(item){
      item.remove();
    }


  }catch(error){

    alert(
      "Delete হয়নি: " +
      error.message
    );

  }

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>'"]/g,
    function(character){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"

      }[character];

    }
  );

}


/* ========================================
   START
======================================== */

checkSession();

</script>

</body>
</html>
