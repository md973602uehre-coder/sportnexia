<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="robots"
  content="noindex,nofollow"
>

<title>SPORTNEXIA Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#111827;
}

.admin-header{
  background:#071426;
  color:#fff;
  padding:18px 20px;
}

.admin-header-inner{
  max-width:950px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  color:#fff;
  text-decoration:none;
  font-size:22px;
  font-weight:900;
}

.brand span{
  color:#238cff;
}

.logout-button{
  border:0;
  background:#ef4444;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.admin-container{
  max-width:950px;
  margin:30px auto;
  padding:0 16px;
}

.admin-card{
  background:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.admin-title{
  margin:0 0 8px;
  font-size:30px;
}

.admin-subtitle{
  margin:0 0 25px;
  color:#6b7280;
}

.language-section{
  margin-top:25px;
  padding:20px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  background:#fafbfc;
}

.language-title{
  margin:0 0 18px;
  font-size:20px;
}

.bangla-title{
  color:#008f5a;
}

.english-title{
  color:#238cff;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:700;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d8dee8;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:180px;
  resize:vertical;
  line-height:1.6;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#238cff;
}

.image-preview{
  display:none;
  width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:12px;
  margin-top:12px;
  background:#f1f3f6;
}

.publish-area{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #e5e7eb;
}

.publish-button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:16px;
  background:#238cff;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.publish-button:disabled{
  opacity:.6;
}

.status-message{
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  display:none;
  font-weight:700;
}

.status-success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status-error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.required{
  color:#ef4444;
}

.news-list{
  display:grid;
  gap:14px;
}

.admin-news-item{
  border:1px solid #e1e5eb;
  border-radius:14px;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:#fafbfc;
}

.admin-news-info{
  min-width:0;
}

.admin-news-category{
  color:#238cff;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
}

.admin-news-item h3{
  margin:6px 0;
  font-size:17px;
}

.admin-news-date{
  color:#7b8493;
  font-size:12px;
}

.delete-button{
  flex:0 0 auto;
  border:0;
  background:#fee2e2;
  color:#dc2626;
  padding:10px 13px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

.loading-news,
.empty-news{
  color:#7b8493;
  padding:20px;
  text-align:center;
}

@media(max-width:600px){

  .admin-card{
    padding:18px;
  }

  .admin-title{
    font-size:25px;
  }

  .admin-news-item{
    align-items:flex-start;
  }

}

</style>

</head>


<body>


<header class="admin-header">

  <div class="admin-header-inner">

    <a href="index.html" class="brand">
      SPORT<span>NEXIA</span>
    </a>

    <button
      id="logoutButton"
      class="logout-button"
      type="button"
    >
      Logout
    </button>

  </div>

</header>


<main class="admin-container">


<section class="admin-card">

<h1 class="admin-title">
  Publish News
</h1>

<p class="admin-subtitle">
  Publish Bengali and English versions together.
</p>


<label>
  Category
  <span class="required">*</span>
</label>

<select id="category">

  <option value="Football">
    Football
  </option>

  <option value="Cricket">
    Cricket
  </option>

  <option value="Sports">
    Sports
  </option>

</select>


<!-- BANGLA -->

<section class="language-section">

<h2 class="language-title bangla-title">
  🇧🇩 বাংলা নিউজ
</h2>

<label>
  বাংলা শিরোনাম
  <span class="required">*</span>
</label>

<input
  id="title_bn"
  type="text"
  placeholder="বাংলা নিউজের শিরোনাম লিখুন"
>

<label>
  বাংলা নিউজ
  <span class="required">*</span>
</label>

<textarea
  id="content_bn"
  placeholder="বাংলা নিউজের বিস্তারিত লিখুন"
></textarea>

<label>
  বাংলা নিউজের ছবি
</label>

<input
  id="image_bn"
  type="file"
  accept="image/*"
>

<img
  id="imageBnPreview"
  class="image-preview"
  alt="Bangla preview"
>

</section>


<!-- ENGLISH -->

<section class="language-section">

<h2 class="language-title english-title">
  🇬🇧 English News
</h2>

<label>
  English Title
  <span class="required">*</span>
</label>

<input
  id="title_en"
  type="text"
  placeholder="Enter English news title"
>

<label>
  English News
  <span class="required">*</span>
</label>

<textarea
  id="content_en"
  placeholder="Write English news content"
></textarea>

<label>
  English News Image
</label>

<input
  id="image_en"
  type="file"
  accept="image/*"
>

<img
  id="imageEnPreview"
  class="image-preview"
  alt="English preview"
>

</section>


<div class="publish-area">

<button
  id="publishButton"
  class="publish-button"
  type="button"
>
  🚀 Publish News
</button>

<div
  id="statusMessage"
  class="status-message"
></div>

</div>

</section>


<!-- PUBLISHED NEWS -->

<section class="admin-card">

<h2>
  📰 Published News
</h2>

<div
  id="newsList"
  class="news-list"
>

  <div class="loading-news">
    Loading published news...
  </div>

</div>

</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const {
  createClient
} = supabase;


const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const ADMIN_UID =
  "081ddd42-e9c0-4419-abd1-01d57c04dcf2";


/* =========================
   LOGIN CHECK
========================= */

async function checkAdmin(){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();


  if(
    !session ||
    !session.user ||
    session.user.id !== ADMIN_UID
  ){

    window.location.href =
      "admin-login.html";

    return false;
  }

  return true;
}


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async()=>{

      await db.auth.signOut();

      window.location.reload();

    }
  );


/* =========================
   STATUS
========================= */

function status(message,type){

  const box =
    document.getElementById(
      "statusMessage"
    );

  box.textContent =
    message;

  box.className =
    "status-message " +
    (
      type === "error"
        ? "status-error"
        : "status-success"
    );

}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(
  inputId,
  previewId
){

  const input =
    document.getElementById(
      inputId
    );

  const preview =
    document.getElementById(
      previewId
    );


  input.addEventListener(
    "change",
    ()=>{

      const file =
        input.files[0];

      if(!file){

        preview.style.display =
          "none";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        event=>{

          preview.src =
            event.target.result;

          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );

}


previewImage(
  "image_bn",
  "imageBnPreview"
);

previewImage(
  "image_en",
  "imageEnPreview"
);


/* =========================
   UPLOAD
========================= */

async function uploadImage(
  file,
  folder
){

  if(!file) return null;


  const ext =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const path =
    `${folder}/${Date.now()}-${crypto.randomUUID()}.${ext}`;


  const {
    error
  } =
    await db
      .storage
      .from("news-images")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error)
    throw error;


  const {
    data
  } =
    db
      .storage
      .from("news-images")
      .getPublicUrl(path);


  return data.publicUrl;

}


/* =========================
   PUBLISH
========================= */

document
  .getElementById("publishButton")
  .addEventListener(
    "click",
    publishNews
  );


async function publishNews(){

  const button =
    document.getElementById(
      "publishButton"
    );


  const category =
    document.getElementById(
      "category"
    ).value;


  const titleBN =
    document.getElementById(
      "title_bn"
    ).value.trim();


  const contentBN =
    document.getElementById(
      "content_bn"
    ).value.trim();


  const titleEN =
    document.getElementById(
      "title_en"
    ).value.trim();


  const contentEN =
    document.getElementById(
      "content_en"
    ).value.trim();


  const imageBN =
    document.getElementById(
      "image_bn"
    ).files[0] || null;


  const imageEN =
    document.getElementById(
      "image_en"
    ).files[0] || null;


  if(
    !titleBN ||
    !contentBN ||
    !titleEN ||
    !contentEN
  ){

    status(
      "সব বাংলা ও English তথ্য পূরণ করুন।",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Publishing...";


  try{

    let imageBNUrl =
      null;

    let imageENUrl =
      null;


    if(imageBN){

      status(
        "বাংলা ছবি Upload হচ্ছে...",
        "success"
      );

      imageBNUrl =
        await uploadImage(
          imageBN,
          "bangla"
        );

    }


    if(imageEN){

      status(
        "English ছবি Upload হচ্ছে...",
        "success"
      );

      imageENUrl =
        await uploadImage(
          imageEN,
          "english"
        );

    }


    const {
      error
    } =
    await db
      .from("news")
      .insert({

        category:category,

        title:titleBN,

        content:contentBN,

        title_bn:titleBN,

        content_bn:contentBN,

        image_bn:imageBNUrl,

        title_en:titleEN,

        content_en:contentEN,

        image_en:imageENUrl,

        image_url:imageBNUrl

      });


    if(error)
      throw error;


    status(
      "✅ বাংলা + English News Publish হয়েছে!",
      "success"
    );


    document
      .getElementById("title_bn")
      .value="";

    document
      .getElementById("content_bn")
      .value="";

    document
      .getElementById("title_en")
      .value="";

    document
      .getElementById("content_en")
      .value="";

    document
      .getElementById("image_bn")
      .value="";

    document
      .getElementById("image_en")
      .value="";


    await loadNews();


  }catch(error){

    console.error(error);

    status(
      error.message ||
      "Publish failed.",
      "error"
    );

  }finally{

    button.disabled=false;

    button.textContent =
      "🚀 Publish News";

  }

}


/* =========================
   LOAD NEWS
========================= */

async function loadNews(){

  const list =
    document.getElementById(
      "newsList"
    );


  list.innerHTML =
    `<div class="loading-news">
      Loading published news...
    </div>`;


  const {
    data,
    error
  } =
  await db
    .from("news")
    .select(
      "id,title,title_bn,title_en,category,created_at"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty-news">
        ❌ News load failed:<br>
        ${error.message}
      </div>`;

    return;
  }


  if(!data || !data.length){

    list.innerHTML =
      `<div class="empty-news">
        No published news found.
      </div>`;

    return;
  }


  list.innerHTML =
    data.map(
      item=>{

        const title =
          item.title_bn ||
          item.title ||
          item.title_en ||
          "Untitled";


        const date =
          item.created_at
            ? new Date(
                item.created_at
              ).toLocaleDateString(
                "en-GB"
              )
            : "";


        return `

          <div
            class="admin-news-item"
          >

            <div
              class="admin-news-info"
            >

              <div
                class="admin-news-category"
              >
                ${escapeHTML(
                  item.category ||
                  "SPORTS"
                )}
              </div>

              <h3>
                ${escapeHTML(title)}
              </h3>

              <div
                class="admin-news-date"
              >
                ${date}
              </div>

            </div>

            <button
              class="delete-button"
              onclick="deleteNews(${item.id})"
            >
              🗑️ Delete
            </button>

          </div>

        `;

      }
    ).join("");

}


/* =========================
   DELETE
========================= */

window.deleteNews =
async function(id){

  const ok =
    confirm(
      "এই নিউজটি Delete করতে চান?"
    );


  if(!ok) return;


  const {
    error
  } =
  await db
    .from("news")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  await loadNews();

};


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>'"]/g,
    char=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"

    }[char])
  );

}


/* =========================
   START
========================= */

(async function(){

  const ok =
    await checkAdmin();

  if(!ok) return;

  await loadNews();

})();

</script>


</body>
</html>
