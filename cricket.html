<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SPORTNEXIA Cricket News - Latest cricket news and updates."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <title>Cricket News | SPORTNEXIA</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sport.css">


  <style>

    /* =========================
       CRICKET PAGE NAV
    ========================= */

    .sport-page-nav {

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

      width: 100%;

      background: #ffffff !important;

      border-bottom: 1px solid #e7eaf0;

      position: sticky;

      top: 0;

      z-index: 9999;

    }


    .sport-page-nav-inner {

      max-width: 1200px;

      margin: 0 auto;

      padding: 10px 16px;

      display: flex !important;

      align-items: center;

      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

    }


    .sport-page-nav-inner::-webkit-scrollbar {

      display: none;

    }


    .sport-page-nav a,
    .sport-page-nav button {

      display: inline-flex !important;

      align-items: center;

      justify-content: center;

      flex: 0 0 auto;

      min-height: 38px;

      padding: 9px 14px;

      border-radius: 999px;

      border: 1px solid #e5e8ef !important;

      background: #f4f6fa !important;

      color: #172033 !important;

      text-decoration: none;

      font-size: 13px;

      font-weight: 700;

      white-space: nowrap;

      cursor: pointer;

      transition: 0.2s ease;

    }


    .sport-page-nav a:hover,
    .sport-page-nav button:hover {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;

    }


    .sport-page-nav .home-btn {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;

    }


    .sport-page-nav .language-btn.active {

      background: #238cff !important;

      color: #ffffff !important;

      border-color: #238cff !important;

    }


    /* =========================
       BREAKING TICKER
    ========================= */

    .breaking-bar {

      display: flex !important;

      align-items: center !important;

      width: 100% !important;

      overflow: hidden !important;

      background: #f5f6fa !important;

      border-bottom: 1px solid #e2e5eb !important;

      height: 48px !important;

      box-sizing: border-box !important;

    }


    .breaking-label {

      flex: 0 0 auto !important;

      background: #e50914 !important;

      color: #ffffff !important;

      font-weight: 800 !important;

      font-size: 14px !important;

      padding: 14px 16px !important;

      height: 100% !important;

      display: flex !important;

      align-items: center !important;

      box-sizing: border-box !important;

      position: relative !important;

      z-index: 2 !important;

    }


    .breaking-window {

      flex: 1 !important;

      min-width: 0 !important;

      overflow: hidden !important;

      white-space: nowrap !important;

      position: relative !important;

    }


    .breaking-track {

      display: inline-flex !important;

      width: max-content !important;

      min-width: 100% !important;

      animation: cricketBreakingMove 24s linear infinite !important;

      will-change: transform !important;

    }


    .breaking-track span {

      display: inline-block !important;

      padding-left: 28px !important;

      padding-right: 80px !important;

      color: #111827 !important;

      font-size: 15px !important;

      font-weight: 600 !important;

    }


    @keyframes cricketBreakingMove {

      0% {

        transform: translateX(100%);

      }

      100% {

        transform: translateX(-100%);

      }

    }


    /* =========================
       CRICKET INTRO
    ========================= */

    .cricket-page-intro {

      background: #061224;

      color: #ffffff;

      text-align: center;

      padding: 20px 15px;

    }


    .cricket-page-intro h1 {

      margin: 0;

      font-size: 30px;

      line-height: 1.2;

    }


    .cricket-page-intro p {

      margin: 8px 0 0;

      color: #aebfd3;

      font-size: 14px;

    }


    /* =========================
       NEWS AREA
    ========================= */

    .cricket-news-section {

      background: #f5f7fb;

      padding: 45px 20px 70px;

      min-height: 500px;

    }


    .cricket-news-inner {

      max-width: 1200px;

      margin: 0 auto;

    }


    .cricket-news-title {

      margin: 0 0 25px;

      color: #081426;

      font-size: 38px;

      font-weight: 800;

    }


    #cricketNews {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 22px;

    }


    /* =========================
       NEWS CARD LINK
    ========================= */

    .news-card-link {

      display: block;

      text-decoration: none;

      color: inherit;

      cursor: pointer;

    }


    .news-card-link:hover {

      text-decoration: none;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .sport-page-nav-inner {

        padding: 9px 10px;

      }


      .sport-page-nav a,
      .sport-page-nav button {

        font-size: 12px;

        padding: 8px 12px;

      }


      .cricket-page-intro {

        padding: 17px 12px;

      }


      .cricket-page-intro h1 {

        font-size: 25px;

      }


      .cricket-page-intro p {

        font-size: 13px;

      }


      .cricket-news-section {

        padding: 35px 20px 55px;

      }


      .cricket-news-title {

        font-size: 32px;

      }


      #cricketNews {

        grid-template-columns: 1fr;

      }


      .breaking-bar {

        height: 44px !important;

      }


      .breaking-label {

        font-size: 12px !important;

        padding: 12px !important;

      }


      .breaking-track span {

        font-size: 14px !important;

      }

    }

  </style>

</head>


<body class="sport-page">


  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="index.html"
        class="brand"
      >
        SPORT<span>NEXIA</span>
      </a>

    </div>

  </header>


  <!-- =========================
       PAGE NAVIGATION
  ========================= -->

  <nav class="sport-page-nav">

    <div class="sport-page-nav-inner">


      <a
        href="index.html"
        class="home-btn"
        id="homeButton"
      >
        🏠 Home
      </a>


      <a
        href="javascript:history.back()"
        id="backButton"
      >
        ← Back
      </a>


      <button
        id="banglaButton"
        class="language-btn"
        type="button"
      >
        🇧🇩 বাংলা
      </button>


      <button
        id="englishButton"
        class="language-btn"
        type="button"
      >
        🇬🇧 English
      </button>


    </div>

  </nav>


  <!-- =========================
       BREAKING
  ========================= -->

  <div
    class="breaking-bar"
    id="breakingBar"
  >

    <div class="breaking-label">
      BREAKING
    </div>


    <div class="breaking-window">

      <div
        class="breaking-track"
        id="breakingTrack"
      >

        <span id="breakingText">
          সর্বশেষ ক্রিকেট আপডেট
        </span>


        <span>
          সর্বশেষ ক্রিকেট আপডেট
        </span>

      </div>

    </div>

  </div>


  <!-- =========================
       CRICKET INTRO
  ========================= -->

  <section
    class="cricket-page-intro"
    id="cricketIntro"
  >

    <h1 id="cricketIntroTitle">
      🏏 ক্রিকেট সংবাদ
    </h1>


    <p id="cricketIntroDescription">
      SPORTNEXIA-এর সর্বশেষ ক্রিকেট খবর, আপডেট ও সংবাদ।
    </p>

  </section>


  <!-- =========================
       CRICKET NEWS
  ========================= -->

  <section class="cricket-news-section">

    <div class="cricket-news-inner">


      <h2
        class="cricket-news-title"
        id="cricketNewsTitle"
      >
        সর্বশেষ ক্রিকেট সংবাদ
      </h2>


      <div id="cricketNews">

        <div class="loading">
          খবর লোড হচ্ছে...
        </div>

      </div>


    </div>

  </section>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="site-footer">

    <div class="container">

      <strong>
        SPORTNEXIA
      </strong>


      <p id="footerSportsText">
        ফুটবল • ক্রিকেট • খেলাধুলার আপডেট
      </p>


      <p>
        © 2026 SPORTNEXIA. All rights reserved.
      </p>

    </div>

  </footer>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="sport.js"></script>


  <!-- =========================
       CRICKET PAGE LANGUAGE
  ========================= -->

  <script>

    function updateCricketPageLanguage() {

      const language =
        localStorage.getItem(
          "sportnexiaLanguage"
        ) || "bn";


      const isEnglish =
        language === "en";


      /* =========================
         HTML LANGUAGE
      ========================= */

      document.documentElement.lang =
        isEnglish
          ? "en"
          : "bn";


      /* =========================
         PAGE TITLE
      ========================= */

      document.title =
        isEnglish
          ? "Cricket News | SPORTNEXIA"
          : "ক্রিকেট সংবাদ | SPORTNEXIA";


      /* =========================
         INTRO TITLE
      ========================= */

      const introTitle =
        document.getElementById(
          "cricketIntroTitle"
        );


      if (introTitle) {

        introTitle.textContent =
          isEnglish
            ? "🏏 Cricket News"
            : "🏏 ক্রিকেট সংবাদ";

      }


      /* =========================
         INTRO DESCRIPTION
      ========================= */

      const introDescription =
        document.getElementById(
          "cricketIntroDescription"
        );


      if (introDescription) {

        introDescription.textContent =
          isEnglish
            ? "Latest cricket news, updates and stories from SPORTNEXIA"
            : "SPORTNEXIA-এর সর্বশেষ ক্রিকেট খবর, আপডেট ও সংবাদ।";

      }


      /* =========================
         NEWS TITLE
      ========================= */

      const newsTitle =
        document.getElementById(
          "cricketNewsTitle"
        );


      if (newsTitle) {

        newsTitle.textContent =
          isEnglish
            ? "Latest Cricket News"
            : "সর্বশেষ ক্রিকেট সংবাদ";

      }


      /* =========================
         FOOTER
      ========================= */

      const footerSports =
        document.getElementById(
          "footerSportsText"
        );


      if (footerSports) {

        footerSports.textContent =
          isEnglish
            ? "Football • Cricket • Sports Updates"
            : "ফুটবল • ক্রিকেট • খেলাধুলার আপডেট";

      }

    }


    /* =========================
       RUN ON LOAD
    ========================= */

    updateCricketPageLanguage();


    /* =========================
       LANGUAGE BUTTONS
    ========================= */

    const cricketBnButton =
      document.getElementById(
        "banglaButton"
      );


    const cricketEnButton =
      document.getElementById(
        "englishButton"
      );


    if (cricketBnButton) {

      cricketBnButton.addEventListener(
        "click",
        () => {

          setTimeout(
            updateCricketPageLanguage,
            50
          );

        }
      );

    }


    if (cricketEnButton) {

      cricketEnButton.addEventListener(
        "click",
        () => {

          setTimeout(
            updateCricketPageLanguage,
            50
          );

        }
      );

    }

  </script>


</body>

</html>
