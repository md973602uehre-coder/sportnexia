<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SPORTNEXIA Cricket News - Latest cricket news and updates."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <title>Cricket News | SPORTNEXIA</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =========================
       CRICKET PAGE NAV
    ========================= */

    .sport-page-nav {

      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100%;
      background: #ffffff;

      border-bottom: 1px solid #e7eaf0;

      position: sticky;
      top: 0;
      z-index: 9999;

    }


    .sport-page-nav-inner {

      max-width: 1200px;
      margin: 0 auto;

      padding: 10px 16px;

      display: flex;
      align-items: center;

      gap: 8px;

      overflow-x: auto;
      scrollbar-width: none;

    }


    .sport-page-nav-inner::-webkit-scrollbar {

      display: none;

    }


    .sport-page-nav a,
    .sport-page-nav button {

      display: inline-flex !important;

      align-items: center;
      justify-content: center;

      flex: 0 0 auto;

      min-height: 38px;

      padding: 9px 14px;

      border-radius: 999px;

      border: 1px solid #e5e8ef;

      background: #f4f6fa;

      color: #172033;

      text-decoration: none;

      font-size: 13px;

      font-weight: 700;

      white-space: nowrap;

      cursor: pointer;

      transition: 0.2s ease;

    }


    .sport-page-nav a:hover,
    .sport-page-nav button:hover {

      background: #238cff;
      color: #ffffff;
      border-color: #238cff;

    }


    .sport-page-nav .home-btn {

      background: #238cff;
      color: #ffffff;
      border-color: #238cff;

    }


    .sport-page-nav .language-btn {

      background: #ffffff;

    }


    /* =========================
       CRICKET NEWS HEADER
    ========================= */

    .cricket-page-intro {

      background: #061224;

      color: #ffffff;

      text-align: center;

      padding: 20px 15px;

    }


    .cricket-page-intro h1 {

      margin: 0;

      font-size: 30px;

      line-height: 1.2;

    }


    .cricket-page-intro p {

      margin: 8px 0 0;

      color: #aebfd3;

      font-size: 14px;

    }


    /* =========================
       NEWS AREA
    ========================= */

    .cricket-news-section {

      background: #f5f7fb;

      padding: 45px 20px 70px;

      min-height: 500px;

    }


    .cricket-news-inner {

      max-width: 1200px;

      margin: 0 auto;

    }


    .cricket-news-title {

      margin: 0 0 25px;

      color: #081426;

      font-size: 38px;

      font-weight: 800;

    }


    #cricketNews {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 22px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .sport-page-nav-inner {

        padding: 9px 10px;

      }


      .sport-page-nav a,
      .sport-page-nav button {

        font-size: 12px;

        padding: 8px 12px;

      }


      .cricket-page-intro {

        padding: 17px 12px;

      }


      .cricket-page-intro h1 {

        font-size: 25px;

      }


      .cricket-page-intro p {

        font-size: 13px;

      }


      .cricket-news-section {

        padding: 35px 20px 55px;

      }


      .cricket-news-title {

        font-size: 32px;

      }


      #cricketNews {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="index.html"
        class="brand"
      >
        SPORT<span>NEXIA</span>
      </a>

    </div>

  </header>


  <!-- =========================
       PAGE NAVIGATION
  ========================= -->

  <nav class="sport-page-nav">

    <div class="sport-page-nav-inner">


      <a
        href="index.html"
        class="home-btn"
      >
        🏠 Home
      </a>


      <a
        href="javascript:history.back()"
      >
        ← Back
      </a>


      <button
        id="banglaButton"
        class="language-btn"
        type="button"
      >
        🇧🇩 বাংলা
      </button>


      <button
        id="englishButton"
        class="language-btn"
        type="button"
      >
        🇬🇧 English
      </button>


    </div>

  </nav>


  <!-- =========================
       BREAKING
  ========================= -->

  <div class="breaking-bar">

    <div class="container">

      <span class="breaking-label">
        BREAKING
      </span>

      <span id="breakingText">
        Latest cricket updates
      </span>

    </div>

  </div>


  <!-- =========================
       CRICKET INTRO
  ========================= -->

  <section class="cricket-page-intro">

    <h1>
      🏏 Cricket News
    </h1>

    <p>
      Latest cricket news, updates and stories from SPORTNEXIA
    </p>

  </section>


  <!-- =========================
       CRICKET NEWS
  ========================= -->

  <section class="cricket-news-section">

    <div class="cricket-news-inner">


      <h2 class="cricket-news-title">
        Latest Cricket News
      </h2>


      <div id="cricketNews">

        <div class="loading">
          Loading cricket news...
        </div>

      </div>


    </div>

  </section>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="sport.js"></script>


</body>

</html>
